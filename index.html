om:"ph\xE0t sii-\u0294\xEDw",es:"Pad see ew",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 ph\xE0t sii-\u0294\xEDw m\u01D4u n\u0268\u0300\u014B caan",pedirTh:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E0B\u0E35\u0E2D\u0E34\u0E4A\u0E27\u0E2B\u0E21\u0E39\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E08\u0E32\u0E19",d:"Fideo ancho salteado a fuego brutal con soja negra, huevo y kale chino, hasta coger el ahumado del wok (que tiene nombre: kr\xE0-th\xE1 l\xFAk fay, el aliento del wok). El anti-pad-thai: nada de \xE1cido ni cacahuete."},{th:"\u0E23\u0E32\u0E14\u0E2B\u0E19\u0E49\u0E32",rom:"r\xE2at n\xE2a",es:"Fideos en salsa",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 r\xE2at n\xE2a m\u01D4u n\u0268\u0300\u014B caan",pedirTh:"\u0E02\u0E2D\u0E23\u0E32\u0E14\u0E2B\u0E19\u0E49\u0E32\u0E2B\u0E21\u0E39\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E08\u0E32\u0E19",d:"El mismo fideo ancho, pero bajo una salsa espesa de caldo, soja y kale chino. Comida de mediod\xEDa de oficina por excelencia. El vinagre con chile de la mesa est\xE1 pensado exactamente para esto."},{th:"\u0E40\u0E22\u0E47\u0E19\u0E15\u0E32\u0E42\u0E1F",rom:"yen-taa-foo",es:"Sopa rosa",r:"De calle",heat:1,pedir:"kh\u0254\u030C\u0254 yen-taa-foo n\u0268\u0300\u014B th\xFBay",pedirTh:"\u0E02\u0E2D\u0E40\u0E22\u0E47\u0E19\u0E15\u0E32\u0E42\u0E1F\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E49\u0E27\u0E22",d:"La sopa de fideos rosa fosforito: el color viene del tofu rojo fermentado. Lleva marisco, alb\xF3ndigas de pescado y wonton frito. Nadie la pide la primera vez por el color y todo el mundo repite."},{th:"\u0E01\u0E4B\u0E27\u0E22\u0E08\u0E31\u0E4A\u0E1A",rom:"k\u01D4ay c\xE1p",es:"Sopa de fideo enrollado",r:"De calle",heat:1,pedir:"kh\u0254\u030C\u0254 k\u01D4ay c\xE1p n\xE1m s\u01CEi",pedirTh:"\u0E02\u0E2D\u0E01\u0E4B\u0E27\u0E22\u0E08\u0E31\u0E4A\u0E1A\u0E19\u0E49\u0E33\u0E43\u0E2A",d:"L\xE1minas de fideo de arroz que se enrollan solas en un caldo cargado de pimienta blanca, con cerdo crujiente y casquer\xEDa. Cl\xE1sico nocturno de Yaowarat; te despeja la nariz y el alma."},{th:"\u0E2A\u0E30\u0E40\u0E15\u0E4A\u0E30",rom:"s\xE0-t\xE9",es:"Satay",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 s\xE0-t\xE9 m\u01D4u s\xECp m\xE1y",pedirTh:"\u0E02\u0E2D\u0E2A\u0E30\u0E40\u0E15\u0E4A\u0E30\u0E2B\u0E21\u0E39\u0E2A\u0E34\u0E1A\u0E44\u0E21\u0E49",d:"Brochetas marinadas en c\xFArcuma y coco, a la brasa, con salsa de cacahuete y el encurtido \u0294aa-c\xE0at de pepino. Lleg\xF3 del mundo malayo-indonesio. Se piden por palos (m\xE1y), y diez es un buen comienzo."},{th:"\u0E2B\u0E21\u0E39\u0E1B\u0E34\u0E49\u0E07",rom:"m\u01D4u p\xEE\u014B",es:"Brochetas de cerdo",r:"De calle",heat:1,pedir:"kh\u0254\u030C\u0254 m\u01D4u p\xEE\u014B s\u01CEam m\xE1y k\xE0p kh\xE2aw n\u01D0aw",pedirTh:"\u0E02\u0E2D\u0E2B\u0E21\u0E39\u0E1B\u0E34\u0E49\u0E07\u0E2A\u0E32\u0E21\u0E44\u0E21\u0E49\u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27",d:"Desayuno andante: cerdo marinado en leche de coco y soja, a la brasa, con bolsita de arroz glutinoso. Tres palos y arroz es el pedido matinal can\xF3nico."},{th:"\u0E42\u0E08\u0E4A\u0E01",rom:"c\xF3ok",es:"Congee de arroz",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 c\xF3ok m\u01D4u s\xE0y kh\xE0y",pedirTh:"\u0E02\u0E2D\u0E42\u0E08\u0E4A\u0E01\u0E2B\u0E21\u0E39\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48",d:"Arroz cocido hasta deshacerse, con alb\xF3ndigas de cerdo, jengibre y huevo que se cuaja dentro. Remedio universal para el est\xF3mago revuelto y desayuno de invierno."},{th:"\u0E02\u0E49\u0E32\u0E27\u0E15\u0E49\u0E21",rom:"kh\xE2aw t\xF4m",es:"Sopa de arroz nocturna",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 kh\xE2aw t\xF4m plaa n\u0268\u0300\u014B th\xFBay",pedirTh:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E15\u0E49\u0E21\u0E1B\u0E25\u0E32\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E49\u0E27\u0E22",d:"El hermano ligero del jok: arroz entero en caldo claro, con pescado o cerdo. Comida oficial de despu\xE9s de la fiesta; los puestos de kh\xE2aw t\xF4m son los que cierran los \xFAltimos."},{th:"\u0E1B\u0E25\u0E32\u0E40\u0E1C\u0E32",rom:"plaa ph\u01CEw",es:"Pescado a la sal",r:"De calle",heat:1,pedir:"kh\u0254\u030C\u0254 plaa ph\u01CEw n\u0268\u0300\u014B tua",pedirTh:"\u0E02\u0E2D\u0E1B\u0E25\u0E32\u0E40\u0E1C\u0E32\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E15\u0E31\u0E27",d:"Tilapia entera cubierta de costra de sal, rellena de citronela, sobre brasa. Se come pellizcando con verdura fresca, fideos y una salsa verde que quita el sentido. Un pescado entero (n\u0268\u0300\u014B tua) para compartir."},{th:"\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07",rom:"kh\xE2aw n\u01D0aw m\xE1-m\xFBa\u014B",es:"Mango con arroz glutinoso",r:"Centro",heat:0,foto:"Mango_sticky_rice_(11785059725).jpg",pedir:"kh\u0254\u030C\u0254 kh\xE2aw n\u01D0aw m\xE1-m\xFBa\u014B n\u0268\u0300\u014B ch\xFAt",pedirTh:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E0A\u0E38\u0E14",d:"Arroz glutinoso en leche de coco, mango maduro y crema de coco salada por encima. Solo est\xE1 bueno de verdad en temporada de mango, de marzo a junio."},{th:"\u0E01\u0E25\u0E49\u0E27\u0E22\u0E17\u0E2D\u0E14",rom:"kl\xFBay th\u0254\u0302\u0254t",es:"Pl\xE1tano frito",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 kl\xFBay th\u0254\u0302\u0254t n\u0268\u0300\u014B th\u01D4\u014B",pedirTh:"\u0E02\u0E2D\u0E01\u0E25\u0E49\u0E27\u0E22\u0E17\u0E2D\u0E14\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E38\u0E07",d:"Pl\xE1tanos peque\xF1os rebozados con coco rallado y s\xE9samo, fritos hasta el crujiente. Se venden en bolsa por veinte baht y desaparecen antes de llegar a casa."},{th:"\u0E42\u0E23\u0E15\u0E35\u0E01\u0E25\u0E49\u0E27\u0E22",rom:"roo-tii kl\xFBay",es:"Roti de pl\xE1tano",r:"De calle",heat:0,pedir:"kh\u0254\u030C\u0254 roo-tii kl\xFBay s\xE0y kh\xE0y",pedirTh:"\u0E02\u0E2D\u0E42\u0E23\u0E15\u0E35\u0E01\u0E25\u0E49\u0E27\u0E22\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48",d:"Masa estirada a golpes sobre la plancha, rellena de pl\xE1tano y huevo, con leche condensada por encima. Vino de la India v\xEDa Malasia; el puesto de roti es la \xFAltima tentaci\xF3n de cada noche."}],Ir=[{id:"historia",name:"Historia",blurb:"Ocho siglos, tres capitales y una obsesi\xF3n: no ser de nadie.",art:"tiempo",secs:[{t:"Antes de que existieran los tailandeses",art:"templo",p:["Lo que hoy es Tailandia estuvo ocupado durante siglos por gente que no era tai. En el centro estaban los mon del reino de Dvaravati, budistas desde el siglo VI. En el noreste y el este mandaba el imperio jemer desde Angkor, que dej\xF3 templos de piedra que todav\xEDa se visitan en Phimai y Phanom Rung. En el sur, el imperio mar\xEDtimo de Srivijaya controlaba el paso entre los dos oc\xE9anos.","Los pueblos tai bajaron poco a poco desde el sur de la actual China entre los siglos VIII y XIII, siguiendo los valles de los r\xEDos. No llegaron como una invasi\xF3n sino como una filtraci\xF3n lenta de aldeas. Cuando el poder jemer se debilit\xF3, ya eran mayor\xEDa en el terreno."],dato:"Todo lo que hoy suena a tailand\xE9s (el alfabeto, el budismo, la cocina de curry) lleg\xF3 prestado de otros: jemeres, mon, indios, chinos, persas y portugueses."},{t:"Sukhothai, el amanecer de la felicidad",art:"templo",p:["En 1238 dos jefes tai se sublevaron contra el gobernador jemer de una ciudad del norte del valle central y fundaron Sukhothai, un nombre que significa literalmente \xABel amanecer de la felicidad\xBB. Los tailandeses lo consideran su primer reino propio, aunque en la pr\xE1ctica fue uno de varios principados en pugna.","Su rey m\xE1s recordado es Ramkhamhaeng. Se le atribuye la creaci\xF3n del alfabeto tailand\xE9s en 1283, adaptando la escritura jemer, que a su vez ven\xEDa de la India. Tambi\xE9n se le atribuye una estela de piedra donde se describe un reino pr\xF3spero con peces en el agua y arroz en los campos, y un rey al que cualquiera pod\xEDa llamar tocando una campana en la puerta de palacio. Algunos historiadores sospechan que la estela es muy posterior.","De Sukhothai viene el estilo art\xEDstico m\xE1s elegante del pa\xEDs: el Buda caminante, con el cuerpo alargado y la t\xFAnica pegada como si estuviera mojada."]},{t:"Lanna, el reino del norte que era otro pa\xEDs",p:["Casi al mismo tiempo, en 1296, el rey Mangrai fundaba Chiang Mai y con ella el reino de Lanna, \xABel mill\xF3n de arrozales\xBB. Durante siglos fue un estado independiente con su propia lengua, su propio alfabeto y su propia arquitectura, m\xE1s cercano culturalmente a Birmania y a Laos que a Bangkok.","Lanna cay\xF3 bajo dominio birmano en 1558 y estuvo dos siglos bajo su control, lo que explica por qu\xE9 la comida, los templos y hasta la cara de los templos del norte parecen otra cosa. No qued\xF3 integrada del todo en Siam hasta finales del siglo XIX."],dato:"Si el khao soi y la salchicha sai ua te saben distintos del resto del pa\xEDs, es porque literalmente vienen de otro reino."},{t:"Ayutthaya, la ciudad de los canales",art:"barco",p:["Fundada en 1351 en una isla entre tres r\xEDos, Ayutthaya fue durante 417 a\xF1os una de las ciudades m\xE1s ricas del mundo. Los viajeros europeos la comparaban con Par\xEDs y con Venecia: canales en lugar de calles, cientos de templos dorados y un mill\xF3n de habitantes en su mejor momento, m\xE1s que Londres en la misma \xE9poca.","Era radicalmente cosmopolita. Hab\xEDa barrios portugueses, holandeses, japoneses, persas, chinos y franceses. Un aventurero griego llamado Constantine Phaulkon lleg\xF3 a ser el ministro m\xE1s poderoso del reino en la d\xE9cada de 1680, hasta que una revuelta lo ejecut\xF3 y Siam cerr\xF3 sus puertas a Europa durante siglo y medio."]},{t:"1767: el a\xF1o en que todo ardi\xF3",p:["Tras una guerra larga y un asedio de catorce meses, el ej\xE9rcito birmano tom\xF3 Ayutthaya en abril de 1767 y la arras\xF3 de forma sistem\xE1tica: fundieron el oro de los budas, quemaron los archivos del reino y deportaron a decenas de miles de personas. Casi toda la literatura, la m\xFAsica y los registros siameses anteriores a esa fecha desaparecieron.","Es la herida fundacional de la historia tailandesa moderna y explica bastante de la relaci\xF3n tensa con Birmania. Hoy las ruinas son Patrimonio de la Humanidad y est\xE1n a hora y media de Bangkok."],dato:"La cabeza de piedra de un Buda envuelta entre las ra\xEDces de una higuera, en Wat Mahathat, es de aquel saqueo: el cuerpo fue destruido y el \xE1rbol se trag\xF3 lo que qued\xF3."},{t:"Taksin: quince a\xF1os y un final oscuro",p:["Un general de padre chino, Taksin, escap\xF3 del asedio con unos cientos de hombres y en apenas quince a\xF1os reconquist\xF3 el pa\xEDs entero, expuls\xF3 a los birmanos y estableci\xF3 una nueva capital en Thonburi, en la orilla oeste del r\xEDo de Bangkok.","Su final es de los episodios m\xE1s inc\xF3modos de la historia oficial: acab\xF3 acusado de desequilibrio mental y de creerse un ser iluminado, fue depuesto en 1782 y ejecutado. La versi\xF3n tradicional dice que lo metieron en un saco de terciopelo y lo golpearon con un mazo de s\xE1ndalo, porque estaba prohibido derramar sangre real tocando el suelo."]},{t:"Bangkok, 1782",art:"corona",p:["El general que sucedi\xF3 a Taksin se coron\xF3 como Rama I, fund\xF3 la dinast\xEDa Chakri \u2014que sigue reinando hoy\u2014 y traslad\xF3 la capital a la otra orilla del r\xEDo, a una aldea de comerciantes chinos llamada Bang Makok. Levant\xF3 el Gran Palacio como una r\xE9plica deliberada de Ayutthaya: la idea era decirle al pa\xEDs que la continuidad no se hab\xEDa roto.","Tambi\xE9n mand\xF3 recopilar por escrito el Ramakien, la versi\xF3n tailandesa del Ramayana indio, porque los manuscritos originales se hab\xEDan perdido en el incendio de Ayutthaya."]},{t:"Los reyes que modernizaron Siam",p:["Mongkut (Rama IV, 1851-1868) hab\xEDa sido monje veintisiete a\xF1os antes de reinar. Aprendi\xF3 lat\xEDn e ingl\xE9s, estudiaba astronom\xEDa y fue el primero en firmar tratados comerciales con las potencias europeas. Muri\xF3 de malaria tras un viaje para observar un eclipse solar que \xE9l mismo hab\xEDa calculado con dos a\xF1os de antelaci\xF3n.","Su hijo Chulalongkorn (Rama V, 1868-1910) es el rey m\xE1s querido de la historia moderna. Aboli\xF3 la postraci\xF3n ante el monarca, cre\xF3 ministerios, escuelas, ferrocarril y correos, y elimin\xF3 por completo la esclavitud en un proceso gradual que termin\xF3 en 1905, sin guerra civil."],dato:"\xABAna y el rey de Siam\xBB y \xABEl rey y yo\xBB est\xE1n prohibidas en Tailandia por retratar a Mongkut de forma que se considera irrespetuosa e hist\xF3ricamente falsa."},{t:"El pa\xEDs que nunca fue colonia",art:"mapa",p:["Siam fue el \xFAnico estado del sudeste asi\xE1tico que nunca fue colonizado, y no por casualidad. Jug\xF3 con que a Francia y a Gran Breta\xF1a les conven\xEDa un estado tap\xF3n entre la Indochina francesa y la Birmania brit\xE1nica, moderniz\xF3 su ej\xE9rcito y su administraci\xF3n para no dar excusas, y cedi\xF3 territorios perif\xE9ricos para conservar el centro.","El precio fue alto: perdi\xF3 Laos y parte de Camboya frente a Francia y cuatro estados malayos frente a Gran Breta\xF1a. Hay una crisis, la de 1893, en la que ca\xF1oneras francesas remontaron el r\xEDo hasta apuntar directamente al Gran Palacio."],dato:"Esa independencia continuada es la fuente principal del orgullo nacional tailand\xE9s, y explica que el pa\xEDs se llame \xABtierra de los libres\xBB."},{t:"1932: se acab\xF3 el rey absoluto",p:["El 24 de junio de 1932, un grupo de militares y funcionarios formados en Europa \u2014el Partido del Pueblo\u2014 dio un golpe incruento y oblig\xF3 a Rama VII a aceptar una constituci\xF3n. En dos horas y sin un solo disparo, Siam pas\xF3 de monarqu\xEDa absoluta a constitucional.","Los dos protagonistas acabaron enfrentados: Pridi Banomyong, civil y progresista, y Phibunsongkhram, militar y nacionalista. Esa tensi\xF3n entre poder civil y poder militar no se ha cerrado desde entonces."]},{t:"De Siam a Tailandia",p:["En 1939 Phibun cambi\xF3 el nombre del pa\xEDs: Siam pas\xF3 a llamarse Prathet Thai, \xABel pa\xEDs de los libres\xBB. Fue parte de una campa\xF1a nacionalista con doce mandatos culturales que dictaban c\xF3mo deb\xEDa comportarse un tailand\xE9s moderno: llevar sombrero, saludar a la bandera, usar tenedor y cuchara, hablar la lengua central y no los dialectos.","En esa campa\xF1a se invent\xF3 tambi\xE9n un plato nacional, del que se habla en el cap\xEDtulo de la cocina."]},{t:"La guerra y el ferrocarril",p:["En diciembre de 1941 Jap\xF3n invadi\xF3 Tailandia y el gobierno firm\xF3 una alianza a las pocas horas. Los japoneses construyeron con prisioneros aliados y trabajadores asi\xE1ticos forzados el ferrocarril entre Tailandia y Birmania, el del puente sobre el r\xEDo Kwai: murieron m\xE1s de cien mil personas, la inmensa mayor\xEDa trabajadores asi\xE1ticos de los que apenas se habla.","A la vez, un movimiento clandestino llamado Seri Thai colaboraba con los aliados desde dentro, con el embajador en Washington neg\xE1ndose a entregar la declaraci\xF3n de guerra. Gracias a esa doble jugada, Tailandia termin\xF3 la guerra sin ser tratada como potencia derrotada."]},{t:"La Guerra Fr\xEDa invent\xF3 el turismo",p:["Durante la guerra de Vietnam, Estados Unidos oper\xF3 desde siete bases a\xE9reas en territorio tailand\xE9s y miles de soldados pasaban all\xED sus permisos de descanso. De ah\xED salieron el primer circuito hotelero, la infraestructura de carreteras del noreste y, con ellos, la industria tur\xEDstica y tambi\xE9n la del sexo, que tiene ah\xED su origen documentado.","En los a\xF1os setenta y ochenta el pa\xEDs despeg\xF3 econ\xF3micamente hasta convertirse en uno de los llamados tigres asi\xE1ticos, hasta que la crisis financiera de 1997 empez\xF3 justamente en Bangkok con el desplome del baht."]},{t:"Rama IX, setenta a\xF1os",art:"corona",p:["Bhumibol Adulyadej rein\xF3 de 1946 a 2016: setenta a\xF1os, el reinado documentado m\xE1s largo del mundo en su momento. Naci\xF3 en Estados Unidos, tocaba el saxo jazz, patent\xF3 inventos de riego y desarroll\xF3 miles de proyectos rurales.","Su muerte en octubre de 2016 paraliz\xF3 el pa\xEDs durante un a\xF1o de luto en el que mucha gente visti\xF3 de negro a diario. Le sucedi\xF3 su hijo Vajiralongkorn, Rama X."]},{t:"La pol\xEDtica de hoy",p:["Desde 1932 Tailandia ha vivido una docena de golpes militares consumados, los dos \xFAltimos en 2006 y 2014, alternados con gobiernos electos. Buena parte del conflicto de las \xFAltimas dos d\xE9cadas se ha expresado en la calle entre movimientos identificados por colores, con apoyos distintos seg\xFAn regi\xF3n y clase.","La monarqu\xEDa est\xE1 protegida por una ley de lesa majestad muy estricta, el art\xEDculo 112 del c\xF3digo penal, que castiga con hasta quince a\xF1os de c\xE1rcel por cargo criticar al rey o a su familia. Se aplica tambi\xE9n a extranjeros y a publicaciones en redes sociales. Es, con diferencia, el tema del que conviene no opinar en p\xFAblico."],dato:"Regla pr\xE1ctica para un extranjero: puedes hablar de pol\xEDtica tailandesa todo lo que quieras, pero de la monarqu\xEDa, ni una broma. Ni en un bar."}]},{id:"platos",name:"De d\xF3nde vienen los platos",blurb:"Casi ninguno es tan antiguo ni tan tailand\xE9s como parece.",art:"wok",secs:[{t:"La cocina tailandesa es mucho m\xE1s joven de lo que crees",art:"especias",p:["El chile no es asi\xE1tico. Es americano, y lo trajeron los portugueses al sudeste asi\xE1tico en el siglo XVI a trav\xE9s de sus rutas comerciales. Antes de eso, la comida siamesa picaba con pimienta negra y jengibre, y no se parec\xEDa nada a lo que hoy llamamos tailand\xE9s.","Lo mismo pasa con la papaya, el tomate, el cacahuete, la pi\xF1a y el ma\xEDz: todos americanos. La cocina que t\xFA vas a comer se form\xF3, en su versi\xF3n reconocible, hace unos cuatrocientos a\xF1os como mucho."],dato:"Los tres pilares del sabor s\xED son antiguos y locales: salsa de pescado fermentado, coco y hierbas frescas como la citronela, la galanga y la hoja de lima kaffir."},{t:"Pad thai: un plato inventado por decreto",art:"fideos",p:["El pad thai no exist\xEDa antes de los a\xF1os cuarenta. Lo impuls\xF3 el gobierno de Phibunsongkhram durante su campa\xF1a nacionalista, en un momento de escasez de arroz tras la guerra: los fideos de arroz aprovechaban mejor el grano roto, se vend\xEDan en la calle y no requer\xEDan cocina.","El Estado reparti\xF3 recetas y foment\xF3 los carritos de fideos. La iron\xEDa es doble: el plato que representa a Tailandia en el mundo se llama literalmente \xABsalteado tailand\xE9s\xBB y se cre\xF3 para distinguirlo de los fideos chinos, cuando la t\xE9cnica, el wok y los fideos son de origen chino."]},{t:"Tom yum: el nombre es la receta",p:["t\xF4m significa hervir y yam es esa mezcla agitada y picante que tambi\xE9n da nombre a las ensaladas tailandesas. As\xED que t\xF4m yam es, literalmente, \xABhervido y mezclado picante\xBB. A\xF1\xE1dele k\xFB\u014B y tienes gambas.","Las hierbas que flotan dentro \u2014citronela partida, rodajas de galanga, hojas de lima kaffir\u2014 no se comen. Est\xE1n ah\xED para perfumar el caldo, igual que una hoja de laurel."],dato:"Hay dos versiones: n\xE1m s\u01CEi, la clara y transparente, y n\xE1m kh\xF4n, con leche evaporada o de coco, que es m\xE1s suave y la m\xE1s com\xFAn en los restaurantes tur\xEDsticos."},{t:"Massaman: Persia dentro de un cazo",art:"especias",p:["El massaman es el curry menos tailand\xE9s de todos. Su nombre viene de \xABmusulm\xE1n\xBB y lleg\xF3 por v\xEDa persa a la corte de Ayutthaya en el siglo XVII, probablemente a trav\xE9s de comerciantes que se establecieron all\xED.","Se nota en las especias: cardamomo, canela, clavo, comino, an\xEDs estrellado. Todas secas y tostadas, al estilo de Oriente Medio y la India, en lugar de las pastas de hierbas frescas machacadas que definen a los curries verdes y rojos."]},{t:"Khao soi: la ruta de las caravanas",p:["El khao soi de Chiang Mai lo trajeron los Haw, comerciantes musulmanes de origen chino que bajaban en caravanas de mulas desde Yunnan cruzando Birmania. Por eso lleva fideos de huevo y no de arroz, y por eso la versi\xF3n tradicional se hace con pollo o ternera, nunca con cerdo.","El curry en polvo y la c\xFArcuma que le dan el color son de influencia birmana e india. Se sirve con chalota cruda, encurtido de mostaza y lima, que est\xE1n ah\xED para cortar la grasa del coco."]},{t:"Som tam: papaya americana, mortero laosiano",art:"mortero",p:["El som tam es de Isan y de Laos, no del centro del pa\xEDs. Se machaca en un mortero de barro alto con una mano de madera, y el sonido r\xEDtmico de ese golpeo es el ruido de fondo de cualquier mercado del noreste.","s\xF4m quiere decir \xE1cido y tam es machacar. La versi\xF3n que comer\xE1s en Bangkok, con cacahuete y az\xFAcar de palma, es la suave. La versi\xF3n de Isan, som tam pla ra, lleva pescado fermentado y cangrejo crudo salado y es otra cosa completamente distinta."],dato:"Cuando te pregunten cu\xE1ntos chiles quieres, la respuesta segura es \xABn\u0268\u0300\u014B m\xE9t\xBB (uno). Dos ya pica de verdad."},{t:"Los chinos trajeron el wok, los fideos y media cocina",art:"wok",p:["La inmigraci\xF3n china, sobre todo teochew del sur, transform\xF3 la comida tailandesa entre los siglos XVIII y XX. De ah\xED vienen el wok y la t\xE9cnica de saltear, todos los fideos, la salsa de soja, el tofu, el cerdo asado, el congee y la costumbre misma de comer en la calle.","El arroz con pollo hervido khao man kai viene de Hainan; el jok es congee canton\xE9s; el kuay teow es el fideo de arroz chino adaptado. Hoy nadie los ve como platos extranjeros."]},{t:"Isan come con la mano",p:["En el noreste el arroz no se sirve suelto sino glutinoso, cocido al vapor y presentado en una cestita de bamb\xFA. Se come con la mano derecha: coges un poco, lo aprietas en una bolita, la aplastas con el pulgar y la usas para mojar o para pinzar la comida.","El tr\xEDo cl\xE1sico de una comida de Isan es som tam, pollo a la brasa k\xE0y y\xE2a\u014B y arroz glutinoso. Isan es la regi\xF3n m\xE1s poblada y la m\xE1s pobre del pa\xEDs, y durante d\xE9cadas su cocina fue mirada por encima del hombro desde Bangkok. Hoy es la que ha conquistado al resto del pa\xEDs."]},{t:"Los postres dorados los invent\xF3 una portuguesa",p:["Todos esos dulces amarillos brillantes hechos con yema de huevo y alm\xEDbar \u2014foi thong, los hilos dorados; thong yip, las flores; thong yot, las gotas\u2014 los introdujo Maria Guyomar de Pinha en la corte de Ayutthaya en el siglo XVII. Era de familia japonesa, portuguesa y bengal\xED, y estuvo casada con Constantine Phaulkon.","Son adaptaciones directas de los dulces conventuales portugueses de yema, los mismos que en Espa\xF1a conocemos como huevos hilados o yemas. Hoy se sirven en bodas y en ceremonias porque llevan la palabra thong, oro, y se consideran de buen augurio."],dato:"Si alg\xFAn d\xEDa te comes un foi thong y te sabe raramente familiar, no es casualidad: es un dulce ib\xE9rico con cuatrocientos a\xF1os de residencia en Asia."},{t:"El sur: coco, c\xFArcuma y roti",p:["La cocina del sur es la m\xE1s picante del pa\xEDs y la m\xE1s marcada por el mundo malayo y musulm\xE1n. Usa mucha c\xFArcuma, c\xFArcuma que ti\xF1e el arroz y el pollo de amarillo, y el kaeng som, un curry agrio anaranjado sin coco que sirve de examen de aguante.","El roti, esa masa que estiran a golpes sobre la plancha y que en versi\xF3n dulce lleva pl\xE1tano y leche condensada, viene de la India v\xEDa Malasia. En su versi\xF3n salada se moja en curry al desayuno."]},{t:"Por qu\xE9 todo lleva salsa de pescado",p:["El n\xE1m plaa es pescado peque\xF1o fermentado con sal durante meses. Aporta la sal y el fondo umami de casi toda la cocina del pa\xEDs; la sal de mesa apenas se usa en la cocina salada.","Tiene un pariente directo en la historia europea: el garum romano se hac\xEDa exactamente igual. Y tiene una consecuencia pr\xE1ctica importante: si eres vegetariano, hay que pedir expl\xEDcitamente m\xE2i s\xE0y n\xE1m plaa, porque va incluso en platos que parecen de verdura."]},{t:"El caf\xE9 con leche condensada",p:["El oliang y el caf\xE9 helado tailand\xE9s llevan leche condensada azucarada porque durante d\xE9cadas no hab\xEDa cadena de fr\xEDo para leche fresca. La leche condensada se conservaba a temperatura ambiente en cualquier puesto de calle.","El mismo motivo explica el t\xE9 helado naranja, el chaa yen, que lleva leche condensada y evaporada. Si lo quieres menos dulce, se pide w\u01CEan n\u0254\u0301\u0254y: poco dulce."]},{t:"La comida jay y el festival vegetariano",p:["Durante nueve d\xEDas de octubre, banderas amarillas con caracteres rojos se\xF1alan los puestos que sirven comida jay: sin carne, sin pescado, sin l\xE1cteos, sin huevo y tambi\xE9n sin ajo, cebolla ni cebollino, que la tradici\xF3n considera excitantes.","Su epicentro es Phuket, donde la comunidad de origen chino lo celebra con procesiones. Es, con diferencia, la mejor semana del a\xF1o para comer vegetariano en Tailandia."]}]},{id:"gastro",name:"La cocina: la historia completa",blurb:"Del arroz y el pescado fermentado a la estrella Michelin de un puesto de calle.",art:"especias",secs:[{t:"Un pa\xEDs construido sobre arroz",p:["En tailand\xE9s no se pregunta \xAB\xBFc\xF3mo est\xE1s?\xBB tantas veces como \xABkin kh\xE2aw r\u0268\u0301 ya\u014B\xBB: \xBFhas comido arroz ya? Comer se dice literalmente \xABcomer arroz\xBB (kin kh\xE2aw), y todo lo dem\xE1s que hay en la mesa se llama k\xE0p kh\xE2aw, \xABlo que acompa\xF1a al arroz\xBB. La estructura entera de una comida tailandesa est\xE1 en esas dos palabras: el arroz es el plato, y el curry, el salteado y la sopa son sus acompa\xF1antes.","Tailandia fue durante d\xE9cadas el mayor exportador de arroz del mundo, y su variedad estrella, el jazm\xEDn hom mal\xED, se considera de las mejores del planeta. En el centro y el sur se come arroz suelto y perfumado; en el norte y en Isan, arroz glutinoso que se coge con la mano."],dato:"Si alguien te dice kin kh\xE2aw r\u0268\u0301 ya\u014B, no te est\xE1 invitando: es un saludo. Se responde kin l\u01FD\xE6w (ya he comido) aunque no sea verdad.",frases:[{rom:"kin kh\xE2aw r\u0268\u0301 ya\u014B",thai:"\u0E01\u0E34\u0E19\u0E02\u0E49\u0E32\u0E27\u0E2B\u0E23\u0E37\u0E2D\u0E22\u0E31\u0E07",es:"\xBFHas comido ya? (saludo)"},{rom:"kin l\u01FD\xE6w",thai:"\u0E01\u0E34\u0E19\u0E41\u0E25\u0E49\u0E27",es:"Ya he comido"},{rom:"kh\xE2aw h\u0254\u030C\u0254m m\xE1-l\xED",thai:"\u0E02\u0E49\u0E32\u0E27\u0E2B\u0E2D\u0E21\u0E21\u0E30\u0E25\u0E34",es:"Arroz jazm\xEDn"},{rom:"kh\xE2aw n\u01D0aw",thai:"\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27",es:"Arroz glutinoso"}]},{t:"El sabor m\xE1s antiguo: pescado fermentado",p:["Antes del chile, antes del coco en la cocina, antes de casi todo, ya estaba el pescado fermentado con sal. Es la capa m\xE1s vieja del sabor tailand\xE9s y la que sigue debajo de todo: el n\xE1m plaa (salsa de pescado l\xEDquida y \xE1mbar) sazona la cocina entera, y el plaa r\xE1a (pescado fermentado espeso y turbio, con meses o a\xF1os de tinaja) manda en Isan.","El plaa r\xE1a es al n\xE1m plaa lo que un queso azul a la mantequilla: mucho m\xE1s bruto, mucho m\xE1s querido por los suyos y desconcertante la primera vez. El som tam \xABtailand\xE9s\xBB de Bangkok lleva n\xE1m plaa; el som tam de verdad de Isan lleva plaa r\xE1a, y la diferencia se nota a un metro."],frases:[{rom:"n\xE1m plaa",thai:"\u0E19\u0E49\u0E33\u0E1B\u0E25\u0E32",es:"Salsa de pescado"},{rom:"plaa r\xE1a",thai:"\u0E1B\u0E25\u0E32\u0E23\u0E49\u0E32",es:"Pescado fermentado de Isan"},{rom:"m\xE2i s\xE0y plaa r\xE1a",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1B\u0E25\u0E32\u0E23\u0E49\u0E32",es:"Sin pescado fermentado"}]},{t:"La cocina de palacio",p:["En la corte de Ayutthaya y luego en la de Bangkok se desarroll\xF3 una segunda cocina, la aah\u01CEan chaaw wa\u014B o comida de la gente de palacio: los mismos platos del pueblo pero llevados a la obsesi\xF3n. Verduras talladas en forma de flor, chiles sin semillas, espinas retiradas una a una, curries colados hasta quedar de seda, y raciones peque\xF1as y perfectas.","De ah\xED vienen los bocados m\xE1s delicados del repertorio: el ch\xE1aw m\xFAa\u014B (saquitos de masa te\xF1idos de azul con flor de guisante de mariposa), el look ch\xFAp (dulces de jud\xEDa mungo esculpidos como frutas en miniatura) y la costumbre de servir el k\u01CEaw ch\u025B\u0302\u025B, arroz en agua helada de jazm\xEDn, en los d\xEDas de m\xE1s calor. La talla de fruta y verdura sigue siendo una disciplina que se estudia."],dato:"Mucho de lo que en un restaurante elegante parece \xABcocina tailandesa moderna\xBB es en realidad cocina de palacio del siglo XIX saliendo por fin del palacio."},{t:"La anatom\xEDa de un curry",p:["Un k\xE6\xE6\u014B tailand\xE9s empieza siempre igual: un mortero y una pasta. Chiles, galanga, citronela, piel de lima kaffir, ra\xEDz de cilantro, ajo, chalota, pasta de gambas. Lo que cambia entre un curry y otro es qu\xE9 chile lleva y qu\xE9 especias se le suman.","El rojo lleva chiles secos rojos; el verde, chiles frescos verdes, y su nombre completo, kh\u01D0aw w\u01CEan, significa \xABverde dulce\xBB por el color, no por el az\xFAcar. El pan\xE6ng es rojo pero m\xE1s denso, con cacahuete. El amarillo y el massaman a\xF1aden especias secas de la ruta india y persa: c\xFArcuma, comino, canela, cardamomo. Y el k\xE6\xE6\u014B p\xE0a, el curry de la selva, no lleva coco: solo agua, pasta y mucho fuego."],frases:[{rom:"k\xE6\xE6\u014B kh\u01D0aw w\u01CEan",thai:"\u0E41\u0E01\u0E07\u0E40\u0E02\u0E35\u0E22\u0E27\u0E2B\u0E27\u0E32\u0E19",es:"Curry verde"},{rom:"k\xE6\xE6\u014B ph\xE8t",thai:"\u0E41\u0E01\u0E07\u0E40\u0E1C\u0E47\u0E14",es:"Curry rojo"},{rom:"k\xE6\xE6\u014B ph\xE1-n\xE6\xE6\u014B",thai:"\u0E41\u0E01\u0E07\u0E1E\u0E30\u0E41\u0E19\u0E07",es:"Curry panaeng"},{rom:"k\xE6\xE6\u014B k\xE0-r\xECi",thai:"\u0E41\u0E01\u0E07\u0E01\u0E30\u0E2B\u0E23\u0E35\u0E48",es:"Curry amarillo"},{rom:"k\xE6\xE6\u014B p\xE0a",thai:"\u0E41\u0E01\u0E07\u0E1B\u0E48\u0E32",es:"Curry de la selva (sin coco)"}]},{t:"El mortero es el electrodom\xE9stico nacional",p:["Hay dos: el de piedra de granito, khr\xF3k h\u01D0n, para machacar pastas de curry, y el alto de barro con mano de madera, khr\xF3k din, para el som tam. El verbo tam (machacar) da nombre a toda una familia de ensaladas.","Se dice que antiguamente una suegra evaluaba a la futura nuera por el ritmo del mortero que se o\xEDa desde fuera de la casa: demasiado lento, perezosa; demasiado fuerte, temperamental. El sonido pok-pok-pok es tan caracter\xEDstico que hay restaurantes que se llaman as\xED."]},{t:"Sopa de fideos: la comida nacional no oficial",p:["Si el pad thai es el plato para el mundo, el k\u01D4ay-t\u01D0aw \u2014la sopa de fideos de herencia china\u2014 es lo que el pa\xEDs come de verdad, a todas horas y en todas partes. Cada puesto tiene su caldo, y el cliente monta el resto: tipo de fideo, carne, con caldo o seco.","Es la comida con m\xE1s vocabulario propio de Tailandia, y por eso tiene su cap\xEDtulo aparte en \xABComer en la calle\xBB. Aprender a pedir fideos es el examen de nivel de cualquier extranjero."]},{t:"2002: el a\xF1o en que Tailandia decidi\xF3 conquistarte el paladar",p:["Que haya un restaurante tailand\xE9s en cada ciudad del mundo no es casualidad: es pol\xEDtica de Estado. En 2002 el gobierno lanz\xF3 el programa Global Thai para multiplicar los restaurantes tailandeses en el extranjero, con cr\xE9ditos, formaci\xF3n de cocineros y un sello oficial de autenticidad, el Thai Select.","Funcion\xF3 tan bien que los polit\xF3logos acu\xF1aron un t\xE9rmino para el fen\xF3meno: gastrodiplomacia. Hab\xEDa unos cinco mil quinientos restaurantes tailandeses fuera del pa\xEDs al empezar el programa; hoy son varias decenas de miles. Media docena de pa\xEDses han copiado la estrategia desde entonces."],dato:"El plan ten\xEDa hasta men\xFAs modelo por nivel de restaurante. El pad thai que probaste en tu ciudad probablemente existe gracias a un documento de un ministerio de Bangkok."},{t:"Jay Fai: una estrella Michelin con gafas de esqu\xED",p:["Cuando la gu\xEDa Michelin lleg\xF3 a Bangkok en 2017, le dio una estrella a un puesto de calle: Raan Jay Fai, el local de una cocinera septuagenaria que saltea al wok sobre carb\xF3n, con gafas de esqu\xED para protegerse del aceite, en una esquina del casco viejo.","Su plato famoso es la tortilla de cangrejo, kh\xE0y c\xEEaw puu: un cilindro dorado relleno de carne de cangrejo que cuesta lo que una cena entera en cualquier otro sitio, y por el que la cola dura horas. La estrella confirm\xF3 lo que en la ciudad ya se sab\xEDa: que la mejor cocina del pa\xEDs no est\xE1 necesariamente bajo techo."]},{t:"La cuchara, el tenedor y ning\xFAn cuchillo",p:["Hasta finales del siglo XIX se com\xEDa con la mano derecha, como se sigue haciendo con el arroz glutinoso. La cuchara y el tenedor llegaron con la ola modernizadora de Rama IV y Rama V, cuando la corte adopt\xF3 maneras europeas para presentarse como pa\xEDs civilizado ante las potencias coloniales.","Pero se adoptaron a la tailandesa: la cuchara es el cubierto principal y el tenedor su ayudante, y el cuchillo no lleg\xF3 a la mesa porque no hace falta: todo viene ya cortado en bocados desde la cocina. Los palillos quedaron reservados para los fideos, que son territorio chino."]},{t:"El arroz frito es comida de aprovechamiento",p:["El kh\xE2aw ph\xE0t naci\xF3, como casi todos los arroces fritos de Asia, para aprovechar el arroz de ayer: el grano fr\xEDo y suelto del d\xEDa anterior saltea mejor que el reci\xE9n hecho, que se apelmaza. Por eso en casa se hace al d\xEDa siguiente del arroz nuevo.","La versi\xF3n tailandesa se distingue por el n\xE1m plaa, la lima que se exprime encima al servir y el phr\xEDk n\xE1m plaa que lo acompa\xF1a. Y tiene una variante gloriosa de puesto de calle: el kh\xE2aw ph\xE0t puu, con cangrejo."],frases:[{rom:"kh\xE2aw ph\xE0t puu",thai:"\u0E02\u0E49\u0E32\u0E27\u0E1C\u0E31\u0E14\u0E1B\u0E39",es:"Arroz frito con cangrejo"},{rom:"kh\u0254\u030C\u0254 m\xE1-naaw d\xFBay",thai:"\u0E02\u0E2D\u0E21\u0E30\u0E19\u0E32\u0E27\u0E14\u0E49\u0E27\u0E22",es:"Con lima, por favor"}]}]},{id:"calle",name:"Comer en la calle",blurb:"D\xF3nde, cu\xE1ndo y sobre todo c\xF3mo pedirlo. El cap\xEDtulo m\xE1s pr\xE1ctico.",art:"fideos",secs:[{t:"Por qu\xE9 la calle cocina mejor que las casas",p:["La comida callejera de Bangkok nace de dos cosas: los canales y los chinos. Cuando la ciudad era agua, los vendedores remaban de casa en casa con la cocina a bordo; al rellenarse los canales, el bote se convirti\xF3 en carrito. Y la inmigraci\xF3n china del XIX trajo el modelo de negocio: una persona, un wok, un solo plato perfeccionado durante una vida.","A eso se suma que muchas viviendas urbanas apenas tienen cocina, y que comer fuera es tan barato que cocinar en casa a menudo sale m\xE1s caro. El resultado es un pa\xEDs donde la calle no es la alternativa barata al restaurante: es el est\xE1ndar contra el que se mide todo lo dem\xE1s."]},{t:"C\xF3mo elegir puesto",p:["Tres reglas pr\xE1cticas. Primera: cola de tailandeses, no de turistas; ellos saben. Segunda: desconf\xEDa del puesto que ofrece cuarenta platos y conf\xEDa en el que hace uno; ese lleva a\xF1os puli\xE9ndolo. Tercera: rotaci\xF3n alta; lo que se vende r\xE1pido no ha tenido tiempo de estropearse.","Un truco de fino observador: mira el bote de los cubiertos y la tabla de cortar. Un puesto que cuida eso, cuida lo dem\xE1s. Y la hora importa: cada puesto tiene su momento del d\xEDa y su clientela fija; el de j\xF3k solo existe al amanecer, el de fideos del mediod\xEDa puede haber cerrado a las tres."],frases:[{rom:"\u0294\xE0-r\u0254\u0300y m\xE2ak",thai:"\u0E2D\u0E23\u0E48\u0E2D\u0E22\u0E21\u0E32\u0E01",es:"Est\xE1 buen\xEDsimo"},{rom:"r\xE1an n\u01CEy \u0294\xE0-r\u0254\u0300y",thai:"\u0E23\u0E49\u0E32\u0E19\u0E44\u0E2B\u0E19\u0E2D\u0E23\u0E48\u0E2D\u0E22",es:"\xBFQu\xE9 puesto est\xE1 bueno?"}]},{t:"El puesto de fideos: el examen de nivel",p:["Pedir un k\u01D4ay-t\u01D0aw es la interacci\xF3n con m\xE1s decisiones de la comida tailandesa, y clavarla te sube diez puntos con cualquier vendedor. Primero el fideo: s\xEAn y\xE0y (ancho y plano), s\xEAn l\xE9k (fino de arroz, el est\xE1ndar), s\xEAn m\xECi (vermicelli fin\xEDsimo), b\xE0-m\xECi (de huevo, amarillo), w\xFAn-s\xEAn (de cristal). Despu\xE9s el formato: n\xE1m (con caldo) o h\u025B\u0302\u014B (seco, ali\xF1ado).","Luego la carne (m\u01D4u cerdo, n\u0268\u0301a ternera, k\xE0y pollo, l\xFBuk ch\xEDn alb\xF3ndigas) y los extras. La palabra m\xE1gica es ph\xED-s\xE8et: \xABespecial\xBB, raci\xF3n grande con m\xE1s de todo por unos baht m\xE1s."],dato:"Pedido completo de ejemplo: s\xEAn l\xE9k n\xE1m m\u01D4u ph\xED-s\xE8et \u2014 fideo fino, con caldo, de cerdo, raci\xF3n especial. Dilo entero y el vendedor te mirar\xE1 distinto.",frases:[{rom:"s\xEAn l\xE9k n\xE1m",thai:"\u0E40\u0E2A\u0E49\u0E19\u0E40\u0E25\u0E47\u0E01\u0E19\u0E49\u0E33",es:"Fideo fino con caldo"},{rom:"s\xEAn y\xE0y h\u025B\u0302\u014B",thai:"\u0E40\u0E2A\u0E49\u0E19\u0E43\u0E2B\u0E0D\u0E48\u0E41\u0E2B\u0E49\u0E07",es:"Fideo ancho, seco"},{rom:"b\xE0-m\xECi m\u01D4u d\xE6\u014B",thai:"\u0E1A\u0E30\u0E2B\u0E21\u0E35\u0E48\u0E2B\u0E21\u0E39\u0E41\u0E14\u0E07",es:"Fideo de huevo con cerdo rojo"},{rom:"ph\xED-s\xE8et",thai:"\u0E1E\u0E34\u0E40\u0E28\u0E29",es:"Especial (raci\xF3n grande)"},{rom:"m\xE2i s\xE0y th\xF9a \u014B\u0254\u0302\u0254k",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E16\u0E31\u0E48\u0E27\u0E07\u0E2D\u0E01",es:"Sin brotes de soja"}]},{t:"Los cuatro botes de la mesa",p:["En cada mesa de fideos hay un carrusel con cuatro botes, el khr\u0268\u0302a\u014B prung: az\xFAcar, chile seco en polvo, vinagre con chiles frescos y n\xE1m plaa con chile picado. Los cuatro sabores \u2014dulce, picante, \xE1cido, salado\u2014 para que cada cual termine su propio bol.","El caldo llega deliberadamente neutro: sazonarlo es trabajo tuyo, no del cocinero, y hacerlo no le ofende en absoluto. El gesto local es probar primero, ajustar despu\xE9s, media cucharadita de cada cosa. El primer bote que un tailand\xE9s toca casi siempre es el az\xFAcar, y eso al reci\xE9n llegado le vuela la cabeza."],frases:[{rom:"n\xE1m s\xF4m phr\xEDk",thai:"\u0E19\u0E49\u0E33\u0E2A\u0E49\u0E21\u0E1E\u0E23\u0E34\u0E01",es:"Vinagre con chile"},{rom:"phr\xEDk p\xF2n",thai:"\u0E1E\u0E23\u0E34\u0E01\u0E1B\u0E48\u0E19",es:"Chile seco en polvo"},{rom:"n\xE1m plaa phr\xEDk",thai:"\u0E19\u0E49\u0E33\u0E1B\u0E25\u0E32\u0E1E\u0E23\u0E34\u0E01",es:"Salsa de pescado con chile"}]},{t:"Pedir como un local: las palabras que lo cambian todo",p:["Hay media docena de coletillas que convierten un pedido de guiri en un pedido de vecino. s\xE0y kh\xE0y daaw: con huevo frito encima, imprescindible en el ph\xE0t kr\xE0-phraw. kh\xE0y yiaw m\xE1-m\xFBa\u014B: huevo poco hecho, con la yema l\xEDquida. \u0294aw ph\xE8t n\xEDt-n\u0254\u0300y: poco picante. m\xE2i ph\xE8t: sin picante. ph\xE8t m\xE2ak: p\xEDcame de verdad.","Y las dos preguntas que te har\xE1n a ti: kin th\xEEi n\xEEi r\u0268\u030C\u0268 \u0294aw kl\xE0p b\xE2an (\xBFpara aqu\xED o para llevar?) y, en puestos de encargo, \u0294aw \u0294\xE0-ray dii (\xBFqu\xE9 va a ser?). Con responder a esas dos ya funcionas."],frases:[{rom:"s\xE0y kh\xE0y daaw",thai:"\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48\u0E14\u0E32\u0E27",es:"Con huevo frito encima"},{rom:"kh\xE0y yiaw m\xE1-m\xFBa\u014B",thai:"\u0E44\u0E02\u0E48\u0E40\u0E22\u0E34\u0E49\u0E21\u0E46",es:"Con la yema l\xEDquida"},{rom:"\u0294aw ph\xE8t n\xEDt-n\u0254\u0300y",thai:"\u0E40\u0E2D\u0E32\u0E40\u0E1C\u0E47\u0E14\u0E19\u0E34\u0E14\u0E2B\u0E19\u0E48\u0E2D\u0E22",es:"Poco picante"},{rom:"ph\xE8t m\xE2ak",thai:"\u0E40\u0E1C\u0E47\u0E14\u0E21\u0E32\u0E01",es:"Muy picante"},{rom:"\u0294\xECm l\u01FD\xE6w kh\u0254\u0300\u0254p-khun",thai:"\u0E2D\u0E34\u0E48\u0E21\u0E41\u0E25\u0E49\u0E27\u0E02\u0E2D\u0E1A\u0E04\u0E38\u0E13",es:"Estoy lleno, gracias"}]},{t:"El kh\xE2aw k\xE6\xE6\u014B: se\xF1alar y comer",p:["El formato m\xE1s antiguo y m\xE1s f\xE1cil para un extranjero: el puesto de bandejas. Una vitrina con ocho o diez curries y salteados ya hechos, y t\xFA se\xF1alas. Se llama kh\xE2aw k\xE6\xE6\u014B, arroz con curry, y el verbo es r\xE2at: verter por encima del arroz.","Se pide por n\xFAmero de cosas: kh\xE2aw r\xE2at k\xE6\xE6\u014B s\u0254\u030C\u0254\u014B y\xE0a\u014B es arroz con dos cosas encima. Es la comida m\xE1s barata del pa\xEDs, la m\xE1s r\xE1pida y una de las mejores maneras de probar platos que jam\xE1s pedir\xEDas por nombre porque no sabes c\xF3mo se llaman."],frases:[{rom:"kh\xE2aw r\xE2at k\xE6\xE6\u014B",thai:"\u0E02\u0E49\u0E32\u0E27\u0E23\u0E32\u0E14\u0E41\u0E01\u0E07",es:"Arroz con curry por encima"},{rom:"\u0294aw s\u0254\u030C\u0254\u014B y\xE0a\u014B",thai:"\u0E40\u0E2D\u0E32\u0E2A\u0E2D\u0E07\u0E2D\u0E22\u0E48\u0E32\u0E07",es:"Dos cosas (de la vitrina)"},{rom:"\u0294an n\xEDi \u0294\xE0-ray",thai:"\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E2D\u0E30\u0E44\u0E23",es:"\xBFEsto qu\xE9 es?"}]},{t:"El desayuno de la calle",p:["La ma\xF1ana tiene sus propios platos. El j\xF3k, congee de arroz con cerdo y jengibre, para est\xF3magos delicados o resacas. El path\u0254\u0302\u014B-k\u01D2o, la masa frita gemela del churro, que se moja en leche condensada o en el propio j\xF3k. Y el m\u01D4u p\xEE\u014B con arroz glutinoso: brochetas de cerdo a la brasa en bolsita, el desayuno andante de medio Bangkok.","El caf\xE9 de puesto, el oo-l\xEDa\u014B y el kaa-f\xE6\xE6 booraan, se cuela con calcet\xEDn de tela y lleva su buena leche condensada. Todo esto desaparece hacia las diez de la ma\xF1ana: el desayuno callejero es un mundo con horario."],frases:[{rom:"j\xF3k m\u01D4u s\xE0y kh\xE0y",thai:"\u0E42\u0E08\u0E4A\u0E01\u0E2B\u0E21\u0E39\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48",es:"Congee de cerdo con huevo"},{rom:"path\u0254\u0302\u014B-k\u01D2o",thai:"\u0E1B\u0E32\u0E17\u0E48\u0E2D\u0E07\u0E42\u0E01\u0E4B",es:"Masa frita (tipo churro)"},{rom:"m\u01D4u p\xEE\u014B n\u0268\u0300\u014B m\xE1y",thai:"\u0E2B\u0E21\u0E39\u0E1B\u0E34\u0E49\u0E07\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E44\u0E21\u0E49",es:"Una brocheta de cerdo"}]},{t:"Mercados: el fresco, el nocturno y el flotante",foto:"https://commons.wikimedia.org/wiki/Special:FilePath/Damnoen_Saduak_Floating_Market.jpg?width=800",p:["El tal\xE0at s\xF2t, el mercado fresco de la ma\xF1ana, es donde compran los cocineros: abre de madrugada y a las nueve ya declina. El tal\xE0at n\xE1t es el mercado ambulante que aparece ciertos d\xEDas. Y el mercado nocturno es mitad cena mitad paseo: la versi\xF3n moderna es el de contenedores y food trucks, la cl\xE1sica es una calle entera de puestos.","Los mercados flotantes fueron el supermercado original del pa\xEDs de los canales; hoy los famosos, como Damnoen Saduak, viven del turismo, pero madrugar en uno peque\xF1o de barrio sigue mereciendo la pena. Y Yaowarat, el barrio chino de Bangkok, es de noche el kil\xF3metro con m\xE1s densidad de comida buena del pa\xEDs."],frases:[{rom:"tal\xE0at s\xF2t",thai:"\u0E15\u0E25\u0E32\u0E14\u0E2A\u0E14",es:"Mercado fresco"},{rom:"tal\xE0at n\xE1t",thai:"\u0E15\u0E25\u0E32\u0E14\u0E19\u0E31\u0E14",es:"Mercado ambulante"},{rom:"tal\xE0at n\xE1m",thai:"\u0E15\u0E25\u0E32\u0E14\u0E19\u0E49\u0E33",es:"Mercado flotante"}]},{t:"La bolsa de pl\xE1stico es un formato serio",p:["Cualquier cosa se sirve para llevar en bolsa: la sopa (bolsa anudada con una goma, y no se derrama, es un arte), el arroz, el curry, el caf\xE9 con su pajita. La frase es s\xE0y th\u01D4\u014B, \xABen bolsa\xBB, y el conjunto de la compra de cena de vuelta a casa colgando del manillar de la moto es una imagen nacional.","Hay hasta un gesto codificado: el vendedor te pregunta si es para tomar aqu\xED levantando el plato, y t\xFA respondes s\xE0y th\u01D4\u014B y lo resuelves todo. La ofensiva contra el pl\xE1stico va reduciendo la cosa, pero despacio."],frases:[{rom:"s\xE0y th\u01D4\u014B",thai:"\u0E43\u0E2A\u0E48\u0E16\u0E38\u0E07",es:"En bolsa (para llevar)"},{rom:"m\xE2i \u0294aw th\u01D4\u014B",thai:"\u0E44\u0E21\u0E48\u0E40\u0E2D\u0E32\u0E16\u0E38\u0E07",es:"Sin bolsa"}]},{t:"El pa\xEDs come a todas horas",p:["En Tailandia no hay tres comidas: hay un picoteo continuo de cinco o seis tomas peque\xF1as, y a nadie le parece raro comerse una sopa de fideos a las once de la ma\xF1ana y otra a las cuatro de la tarde. La calle acompa\xF1a ese ritmo: siempre hay algo abierto, y cada franja tiene su especialidad.","La \xFAltima parada de la noche es el kh\xE2aw t\xF4m, la sopa ligera de arroz con acompa\xF1amientos, comida oficial de despu\xE9s de la fiesta, o el puesto de k\u01D4ay-t\u01D0aw de madrugada junto a las paradas de moto-taxi."]},{t:"\xBFEs seguro? Casi siempre, y as\xED lo compruebas",p:["La comida de puesto en Tailandia es en general muy segura, m\xE1s que la de alg\xFAn restaurante vac\xEDo con la comida esperando. Las claves son las de siempre: rotaci\xF3n alta, cocinado al momento delante de ti, y a plancha o wok bien calientes.","El hielo cil\xEDndrico con agujero es industrial y seguro. Con lo que conviene m\xE1s prudencia los primeros d\xEDas es con lo crudo: los mariscos crudos de algunos som tam y las ensaladas de gamba cruda son para est\xF3magos ya rodados."]}]},{id:"despensa",name:"La despensa",blurb:"Los ingredientes que hacen que todo sepa a Tailandia.",art:"mortero",secs:[{t:"Los chiles y sus nombres",p:["El m\xE1s temido es el m\xE1s peque\xF1o: el phr\xEDk kh\xEEi n\u01D4u, cuyo nombre significa literalmente \xABchile caca de rat\xF3n\xBB por el tama\xF1o. Es el que pica de verdad y el que machacan en el som tam. El phr\xEDk ch\xEDi f\xE1a, \xABchile que apunta al cielo\xBB, es el grande rojo o verde, mucho m\xE1s suave, que se usa en rodajas y para dar color.","El chile seco molido es phr\xEDk p\xF2n, y los chiles secos enteros fritos que decoran algunos platos se pueden comer o apartar, t\xFA decides. Regla de bolsillo: cuanto m\xE1s peque\xF1o el chile, m\xE1s da\xF1o hace."],frases:[{rom:"phr\xEDk kh\xEEi n\u01D4u",thai:"\u0E1E\u0E23\u0E34\u0E01\u0E02\u0E35\u0E49\u0E2B\u0E19\u0E39",es:"Chile peque\xF1o (el que pica)"},{rom:"phr\xEDk ch\xEDi f\xE1a",thai:"\u0E1E\u0E23\u0E34\u0E01\u0E0A\u0E35\u0E49\u0E1F\u0E49\u0E32",es:"Chile grande (suave)"},{rom:"n\u0268\u0300\u014B m\xE9t",thai:"\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E40\u0E21\u0E47\u0E14",es:"Un solo chile"}]},{t:"Galanga, jengibre y krachai: primos que no se sustituyen",p:["La kh\xE0a (galanga) parece jengibre pero no lo es: m\xE1s dura, m\xE1s c\xEDtrica, con algo de pino y de medicina. Es el alma del tom kha y del tom yum, y si la cambias por jengibre el plato se va a otro pa\xEDs. El kh\u01D0\u014B (jengibre) manda en los platos de herencia china.","El tercer primo es el kr\xE0-chaay, los \xABdedos chinos\xBB: ra\xEDces finas y alargadas, con sabor terroso y alcanforado, que aparecen en los curries de pescado y en el k\xE6\xE6\u014B p\xE0a. Los tres se venden juntos en el mercado y confundirlos es el error de compra cl\xE1sico."]},{t:"Las tres albahacas",p:["El kr\xE0-phraw (albahaca sagrada) tiene la hoja mate, algo dentada, y un punto picante de clavo; es la del ph\xE0t kr\xE0-phraw y muere si la guardas: se usa el mismo d\xEDa. El h\u01D2o-r\xE1-phaa (albahaca tailandesa) tiene tallo morado y sabor a an\xEDs; es la que corona el curry verde y acompa\xF1a a los fideos.","La tercera, m\xE6\xE6\u014B-l\xE1k, es la albahaca lim\xF3n, m\xE1s rara de ver, con hoja p\xE1lida y perfume c\xEDtrico, t\xEDpica del k\xE6\xE6\u014B lia\u014B. En una carta traducida las tres aparecen como \xABbasil\xBB, que es como llamar \xABqueso\xBB al parmesano, al brie y al cabrales."],frases:[{rom:"kr\xE0-phraw",thai:"\u0E01\u0E30\u0E40\u0E1E\u0E23\u0E32",es:"Albahaca sagrada"},{rom:"h\u01D2o-r\xE1-phaa",thai:"\u0E42\u0E2B\u0E23\u0E30\u0E1E\u0E32",es:"Albahaca tailandesa (anisada)"}]},{t:"La lima kaffir: la hoja y la c\xE1scara, no el zumo",p:["Del m\xE1-kr\xF9ut no se aprovecha el zumo, que es escaso y amargo, sino todo lo dem\xE1s: la hoja doble, que perfuma sopas y curries y se retira como el laurel, y la c\xE1scara rugosa, que va machacada en las pastas de curry.","La lima de zumo es otra: la m\xE1-naaw, peque\xF1a y lisa, la que se exprime sobre todo en el \xFAltimo segundo, nunca durante la cocci\xF3n, porque el calor la amarga. Ese chorro final de lima cruda es una firma de la cocina tailandesa."]},{t:"Az\xFAcar de coco: el dulce que no empalaga",p:["El n\xE1m-taan m\xE1-phr\xE1aw se hace hirviendo la savia de la flor del cocotero hasta que carameliza: queda una pasta \xE1mbar, h\xFAmeda, con fondo de caramelo y humo. Es el dulce tradicional de las salsas, del som tam y de los postres.","El az\xFAcar blanco lo ha ido sustituyendo en muchos puestos por precio, y esa es una de las razones de que la comida tailandesa moderna sea m\xE1s dulce que la de hace dos generaciones, algo de lo que los propios tailandeses mayores se quejan exactamente igual que tu abuela."]},{t:"El coco: crema, leche y aceite",p:["La leche de coco no es el agua de dentro: es la pulpa rallada y exprimida. El primer prensado da la h\u01D4a k\xE0-th\xED, la crema espesa, y el segundo la h\u01CEa\u014B k\xE0-th\xED, la leche ligera. Un curry cl\xE1sico empieza friendo la pasta en la crema hasta que el aceite del coco se separa y brilla; ese \xABcorte\xBB de la crema es se\xF1al de curry bien hecho, no de curry estropeado.","En los mercados a\xFAn se ve la m\xE1quina de rallar y exprimir coco al momento, y la diferencia con el de lata es la que va del zumo natural al envasado."]},{t:"Kapi: la pasta que huele a puerto",p:["El k\xE0-p\xEC es pasta de camaroncillos fermentados con sal, morada y oscura, de olor potente y sabor hondo. Va en casi todas las pastas de curry y es la base del n\xE1m phr\xEDk k\xE0-p\xEC, el dip m\xE1s casero del pa\xEDs, que se come con verduras, tortilla y pescado frito.","Su plato estrella es el kh\xE2aw khl\xFAk k\xE0-p\xEC: arroz salteado con la pasta, servido con cerdo dulce, mango verde, huevo en tiras y chalota, todo separado en el plato para mezclar en la mesa. Uno de los platos m\xE1s bonitos y completos del repertorio."],frases:[{rom:"kh\xE2aw khl\xFAk k\xE0-p\xEC",thai:"\u0E02\u0E49\u0E32\u0E27\u0E04\u0E25\u0E38\u0E01\u0E01\u0E30\u0E1B\u0E34",es:"Arroz con pasta de gambas"}]},{t:"El tamarindo: el \xE1cido amable",p:["El m\xE1-kh\u01CEam da la acidez redonda y afrutada del pad thai y de muchas sopas del sur; es el contrapunto suave de la lima, que es m\xE1s agresiva. Se compra en bloque de pulpa y se disuelve en agua caliente.","El tamarindo dulce de mesa, que se come como fruta, es un orgullo de la provincia de Phetchabun. Y las semillas tostadas fueron durante d\xE9cadas el \xABpipas\xBB de los cines de pueblo."]},{t:"Cilantro: la ra\xEDz vale m\xE1s que la hoja",p:["En la cocina tailandesa la parte noble del cilantro no es la hoja, que decora, sino la ra\xEDz: r\xE2ak ph\xE0k chii, machacada con ajo y pimienta blanca. Ese tr\xEDo es la marinada madre del pa\xEDs, la que llevan el m\u01D4u p\xEE\u014B, el pollo a la brasa y media parrilla nacional.","Por eso en los mercados tailandeses el cilantro se vende con su ra\xEDz entera y limpia, algo casi imposible de encontrar en un supermercado europeo. Si un d\xEDa cocinas tailand\xE9s en casa, esa ra\xEDz es el ingrediente que lo cambia todo."]}]},{id:"dulce",name:"Dulce y bebida",blurb:"Los khan\u01D2m, el hielo que lleg\xF3 en barco y el t\xE9 naranja.",art:"krathong",secs:[{t:"Khan\u01D2m: un mundo aparte",p:["Los dulces tailandeses, khan\u01D2m, no son postres al modo europeo: se comen a cualquier hora, se compran por la calle y forman un repertorio enorme basado en cuatro pilares: arroz glutinoso, coco, az\xFAcar de palma y huevo. Sal incluida: casi todo dulce tailand\xE9s lleva su pizca, y muchos rematan con crema de coco salada por encima.","Los tres formatos que ver\xE1s m\xE1s: al vapor en hoja de pl\xE1tano, a la plancha en moldes, y en alm\xEDbar perfumado con velas de jazm\xEDn, un aroma ahumado floral que se llama tian \xF2p y que no existe en ninguna otra reposter\xEDa."],frases:[{rom:"khan\u01D2m",thai:"\u0E02\u0E19\u0E21",es:"Dulce, snack"},{rom:"w\u01CEan n\u0254\u0301\u0254y",thai:"\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22",es:"Poco dulce"}]},{t:"Khan\u01D2m khr\xF3k: los bu\xF1uelos de coco de la plancha",p:["Una plancha de hierro con hoyuelos, masa de arroz y leche de coco, tapa encima, y en tres minutos salen medias esferas doradas por fuera y cremosas por dentro, que el vendedor junta de dos en dos. Se venden por juegos y se comen quem\xE1ndote.","Es de los dulces m\xE1s antiguos del repertorio y de los pocos que se siguen haciendo igual que hace doscientos a\xF1os. La versi\xF3n con cebolleta por encima, mitad dulce mitad salada, es la de los puristas."],frases:[{rom:"khan\u01D2m khr\xF3k n\u0268\u0300\u014B ch\xFAt",thai:"\u0E02\u0E19\u0E21\u0E04\u0E23\u0E01\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E0A\u0E38\u0E14",es:"Un juego de khanom krok"}]},{t:"Khan\u01D2m b\u0268\u0302a\u014B: el taco crujiente del siglo XVII",p:["Una oblea fin\xEDsima y crujiente, doblada como un taco, rellena de merengue y de hilos dorados de yema (los foi th\u0254\u0254\u014B portugueses) o de coco salado. Lleva vendi\xE9ndose por la calle desde tiempos de Ayutthaya.","Es el ejemplo perfecto de c\xF3mo la reposter\xEDa ib\xE9rica del XVII se disolvi\xF3 en la calle tailandesa hasta volverse invisible: nadie que compra khan\u01D2m b\u0268\u0302a\u014B piensa en Portugal, y sin embargo ah\xED est\xE1 la yema hilada."]},{t:"El hielo lleg\xF3 en barco",p:["Hasta finales del siglo XIX, en Siam el hielo no exist\xEDa. Lleg\xF3 primero en barco desde Singapur, car\xEDsimo, como curiosidad para la corte, y la primera f\xE1brica local abri\xF3 a principios del XX. La palabra lo delata: n\xE1m kh\xE6\u030C\u014B, \xABagua dura\xBB, un nombre inventado para una cosa nueva.","El pa\xEDs tropical se enamor\xF3 del fr\xEDo con una intensidad que dura hasta hoy: caf\xE9 con un palmo de hielo, cerveza con hielo (s\xED, y funciona con el calor), fruta sobre hielo picado. El n\xE1m kh\xE6\u030C\u014B s\u01CEi, el granizado con siropes y coberturas, fue el rey de los recreos durante un siglo."],frases:[{rom:"s\xE0y n\xE1m kh\xE6\u030C\u014B y\u0264\u0301-y\u0264\u0301",thai:"\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07\u0E40\u0E22\u0E2D\u0E30\u0E46",es:"Con mucho hielo"},{rom:"m\xE2i s\xE0y n\xE1m kh\xE6\u030C\u014B",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07",es:"Sin hielo"}]},{t:"Chaa yen: por qu\xE9 el t\xE9 es naranja",p:["El t\xE9 helado tailand\xE9s se hace con t\xE9 negro fuerte del mix chaa thai, que lleva especias y el colorante que le da ese naranja imposible, m\xE1s leche condensada y evaporada. Naci\xF3 en los puestos chinos de caf\xE9 y se convirti\xF3 en la bebida nacional de la tarde.","La familia completa: chaa yen (el naranja con leche), chaa dam yen (negro con az\xFAcar, sin leche), chaa m\xE1-naaw (negro con lima, el m\xE1s refrescante). P\xEDdelo w\u01CEan n\u0254\u0301\u0254y si no quieres el subid\xF3n de az\xFAcar de serie."],frases:[{rom:"chaa yen w\u01CEan n\u0254\u0301\u0254y",thai:"\u0E0A\u0E32\u0E40\u0E22\u0E47\u0E19\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22",es:"T\xE9 tailand\xE9s poco dulce"},{rom:"chaa m\xE1-naaw",thai:"\u0E0A\u0E32\u0E21\u0E30\u0E19\u0E32\u0E27",es:"T\xE9 con lima"}]},{t:"Del calcet\xEDn al caf\xE9 de especialidad",p:["El caf\xE9 cl\xE1sico de puesto, kaa-f\xE6\xE6 booraan, se cuela con un filtro de tela con mango \u2014el famoso calcet\xEDn\u2014 y se sirve dulce y contundente: oo-l\xEDa\u014B si es negro con hielo. Es herencia de los caf\xE9s chinos de esquina, los mismos del path\u0254\u0302\u014B-k\u01D2o.","Y luego est\xE1 la otra historia: los proyectos reales de los a\xF1os setenta sustituyeron el opio de las monta\xF1as del norte por cafetales de ar\xE1bica, y de aquello ha salido, dos generaciones despu\xE9s, una escena de caf\xE9 de especialidad en Chiang Mai y Bangkok de las mejores de Asia. El caf\xE9 tailand\xE9s de monta\xF1a hoy gana premios."],frases:[{rom:"oo-l\xEDa\u014B",thai:"\u0E42\u0E2D\u0E40\u0E25\u0E35\u0E49\u0E22\u0E07",es:"Caf\xE9 negro con hielo (cl\xE1sico)"},{rom:"kaa-f\xE6\xE6 r\u0254\u0301\u0254n",thai:"\u0E01\u0E32\u0E41\u0E1F\u0E23\u0E49\u0E2D\u0E19",es:"Caf\xE9 caliente"}]},{t:"Las aguas de colores",p:["Las jarras de colores de los puestos de bebida son infusiones fr\xEDas con siglos de uso: la roja es n\xE1m kr\xE0-j\xEDap (hibisco, \xE1cida), la verde intensa es bai t\u0259\u0259y (pandan, dulce y herb\xE1cea), la marr\xF3n clara es n\xE1m m\xE1-tuum (fruta de bael, la que dan hasta en los hospitales), y la amarilla turbia, n\xE1m \u0294\u0254\u0302\u0254y, ca\xF1a de az\xFAcar reci\xE9n prensada.","Casi todas se endulzan de serie, as\xED que la coletilla w\u01CEan n\u0254\u0301\u0254y vuelve a ser tu amiga. La de crisantemo, n\xE1m k\xE9k-huay, es la de las celebraciones chinas."]},{t:"Fruta con sal, az\xFAcar y chile",p:["El puesto de fruta cortada \u2014bolsa, palillo de madera, hielo\u2014 lleva siempre un sobrecito aparte: el phr\xEDk k\u0268a, mezcla de sal, az\xFAcar y chile molido para mojar la fruta. Con el mango verde, la guayaba o la pi\xF1a, el contraste es adictivo y explica media cocina tailandesa en un gesto.","La fruta verde con sal-chile no es una rareza: el mango verde crujiente mojado en n\xE1m plaa w\u01CEan (salsa dulce de pescado con chalota) es una merienda cl\xE1sica que a los tailandeses fuera del pa\xEDs se les aparece en sue\xF1os."],frases:[{rom:"m\xE1-m\xFBa\u014B d\xECp",thai:"\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07\u0E14\u0E34\u0E1A",es:"Mango verde"},{rom:"s\xE0p-p\xE0-r\xF3t n\u0268\u0300\u014B th\u01D4\u014B",thai:"\u0E2A\u0E31\u0E1A\u0E1B\u0E30\u0E23\u0E14\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E38\u0E07",es:"Una bolsa de pi\xF1a"}]},{t:"Sang Som y el ritual del set",p:["La bebida de celebraci\xF3n popular es el \xABset\xBB: una botella de ron local (Sang Som o Hong Thong), cubo de hielo, botellines de soda y a veces cola, y todo el grupo compartiendo la misma botella en vasos con mucho hielo. Se bebe largo, aguado y durante horas: el objetivo es la sobremesa, no el golpe.","La cerveza \u2014Singha, Chang, Leo\u2014 se sirve tambi\xE9n con hielo sin ning\xFAn complejo, y con este clima acaba teniendo todo el sentido. Recuerda las franjas legales de venta (11-14 h y 17-24 h) y los d\xEDas budistas secos."],frases:[{rom:"bia s\u01CEam kh\xF9at",thai:"\u0E40\u0E1A\u0E35\u0E22\u0E23\u0E4C\u0E2A\u0E32\u0E21\u0E02\u0E27\u0E14",es:"Tres botellas de cerveza"},{rom:"kh\u0254\u030C\u0254 n\xE1m kh\xE6\u030C\u014B \u0294\xECik",thai:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07\u0E2D\u0E35\u0E01",es:"M\xE1s hielo, por favor"}]}]},{id:"nombres",name:"Qu\xE9 significan los nombres",blurb:"Los platos, las calles y las personas se llaman como se llaman por algo.",art:"letras",secs:[{t:"El nombre de Bangkok es el m\xE1s largo del mundo",p:["Bangkok no se llama Bangkok en tailand\xE9s. Su nombre ceremonial completo tiene 168 letras y est\xE1 reconocido como el top\xF3nimo m\xE1s largo del planeta. Empieza por Krungthepmahanakhon Amonrattanakosin y sigue durante un buen rato con t\xEDtulos en pali y s\xE1nscrito.","Traducido, viene a decir algo as\xED como: ciudad de los \xE1ngeles, gran ciudad, morada del Buda de esmeralda, ciudad inexpugnable, gran capital del mundo dotada de nueve gemas, ciudad feliz, morada real donde reina el rey reencarnado, ciudad concedida por Indra y construida por Vishnukarn.","En el d\xEDa a d\xEDa lo abrevian a las dos primeras palabras: Krung Thep, la ciudad de los \xE1ngeles. Muchos escolares se lo aprenden entero cantando."],dato:"Los tailandeses no usan la palabra \xABBangkok\xBB. Si dices Krung Thep te entiende cualquier taxista."},{t:"Entonces, \xBFde d\xF3nde sale \xABBangkok\xBB?",p:["Del nombre de la aldea que hab\xEDa en la orilla antes de que Rama I la convirtiera en capital: Bang Makok. bang es un pueblo junto al agua y makok es el olivo silvestre asi\xE1tico. Aldea de los olivos, m\xE1s o menos.","Los comerciantes europeos se quedaron con ese nombre, lo pusieron en sus cartas de navegaci\xF3n y el resto del mundo lo copi\xF3 durante dos siglos mientras el pa\xEDs entero lo llamaba de otra manera."]},{t:"Thai significa libre",p:["El nombre actual del pa\xEDs, Prathet Thai, se traduce como \xABel pa\xEDs de los libres\xBB, y se adopt\xF3 en 1939. Antes se llamaba Siam, un nombre de origen discutido que probablemente venga del s\xE1nscrito y que usaban sobre todo los extranjeros.","El cambio no fue inocente: subrayaba la idea de un estado tai \xE9tnicamente definido y de un pueblo que nunca fue colonizado."]},{t:"Los nombres de los platos son instrucciones de cocina",p:["Una vez tienes veinte palabras, la carta se lee sola. El primer trozo suele ser la t\xE9cnica y el resto los ingredientes: ph\xE0t es saltear al wok, th\u0254\u0302\u0254t fre\xEDr, t\xF4m hervir, n\u0268\u0302\u014B al vapor, y\xE2a\u014B a la brasa, \u0294\xF2p al horno, yam ensalada picante, k\xE6\xE6\u014B curry.","As\xED, ph\xE0t kr\xE0-phraw es salteado de albahaca sagrada; kh\xE2aw ph\xE0t es arroz salteado; plaa n\u0268\u0302\u014B manaao es pescado al vapor con lima; kh\xE2aw man k\xE0y es arroz graso con pollo, porque el arroz se cuece en el caldo del pollo."],dato:"Con la t\xE9cnica, la prote\xEDna y una hierba ya puedes pedir pr\xE1cticamente cualquier cosa: ph\xE0t + k\xE0y (pollo) + kr\xE0-phraw."},{t:"C\xF3mo leer un mapa tailand\xE9s",art:"mapa",p:["Los top\xF3nimos son casi todos compuestos transparentes. wat es templo; phra es sagrado; doi es monta\xF1a en el norte; khao es monta\xF1a o colina en el centro y el sur; ko es isla; hat es playa; ao es bah\xEDa; nam o mae nam es r\xEDo.","Y en las ciudades: thanon es una calle principal, soi es el callej\xF3n que sale de ella, talat es mercado, sanam es campo o plaza. Los hist\xF3ricos: chiang es ciudad amurallada (Chiang Mai, Chiang Rai), nakhon es ciudad grande, buri es ciudad fortificada (Kanchanaburi, Lopburi), nong es laguna o pantano.","Con eso, \xABDoi Suthep\xBB es la monta\xF1a de Suthep, \xABKo Samui\xBB es la isla de Samui y \xABHat Yai\xBB es la playa grande, aunque Hat Yai est\xE9 tierra adentro."]},{t:"Todo el mundo tiene un apodo, y es el nombre real",art:"colores",p:["Cada tailand\xE9s tiene un nombre oficial largo, de origen pali o s\xE1nscrito, que solo aparece en el DNI y en los documentos, y un apodo de una s\xEDlaba que se lo pone la familia al nacer y que usa absolutamente todo el mundo: jefes, profesores, amigos y a veces hasta la prensa.","Los apodos son de todo tipo: Lek (peque\xF1o), Noi (poquito), Moo (cerdo), Gai (pollo), Nok (p\xE1jaro), Fon (lluvia), Ple, Ple, Beer, Benz, Ford, Golf, Oil o Bank. Los de marcas y palabras inglesas son una moda de las \xFAltimas d\xE9cadas."],dato:"Si conoces a alguien llamado Moo, no es una broma: es que de beb\xE9 estaba gordito."},{t:"Los apellidos se inventaron en 1913",p:["Hasta hace poco m\xE1s de un siglo, en Siam no hab\xEDa apellidos. Los introdujo Rama VI en 1913 imitando el sistema europeo, con una condici\xF3n peculiar: cada apellido deb\xEDa ser \xFAnico en todo el pa\xEDs.","El resultado es que los apellidos tailandeses son largu\xEDsimos, muy elaborados y pr\xE1cticamente irrepetibles, y que dos personas con el mismo apellido son casi con certeza parientes. El propio rey compuso miles de ellos a mano para las familias que lo solicitaban."]},{t:"\xABRama\xBB es un nombre que ellos no usan",p:["Llamar a los reyes Rama I, Rama V o Rama IX es una convenci\xF3n occidental introducida en el siglo XX; viene del h\xE9roe del Ramayana. En tailand\xE9s se les nombra con t\xEDtulos y nombres propios.","El nombre del rey Bhumibol, por ejemplo, significa \xABfuerza de la tierra\xBB, y el de su padre Mahidol es el nombre de una universidad hoy famosa por su facultad de medicina."]}]},{id:"costumbres",name:"Costumbres",blurb:"Las reglas no escritas que se notan al segundo d\xEDa.",art:"wai",secs:[{t:"El wai no se devuelve siempre",art:"wai",p:["El saludo con las palmas juntas es una escala de estatus, no un \xABhola\xBB neutro. Lo inicia siempre la persona de menor edad o rango, y cuanto m\xE1s alto colocas las manos y m\xE1s inclinas la cabeza, m\xE1s respeto expresas: a la altura del pecho para un igual, de la barbilla para un mayor, de la frente para un monje o para la imagen de un Buda.","Un adulto no le devuelve el wai a un ni\xF1o, ni a un camarero, ni al que te da el cambio: se responde con una sonrisa y un gesto de cabeza. Devolv\xE9rselo a todo el mundo es la se\xF1al m\xE1s clara de reci\xE9n llegado."],dato:"Nunca hagas el wai con algo en la mano ni desde una moto. Con una sonrisa basta."},{t:"La cabeza arriba, los pies abajo",p:["La cabeza es la parte m\xE1s sagrada del cuerpo y los pies la m\xE1s impura. De ah\xED salen media docena de reglas: no toques la cabeza de nadie, ni siquiera a un ni\xF1o de forma cari\xF1osa; no pases la mano por encima de la cabeza de otra persona; no pongas los pies en alto ni apuntes con la planta a alguien o a una imagen de Buda.","Si te sientas en el suelo de un templo, la postura correcta es de lado con las piernas recogidas hacia atr\xE1s. Y no se\xF1ales nada con el pie, ni siquiera para indicar d\xF3nde est\xE1 algo en el suelo."]},{t:"Kreng jai: la reticencia a incomodar",p:["kreng jai es de esas palabras que explican un pa\xEDs entero. Significa algo as\xED como no querer ser una molestia, no querer imponer, no querer hacer quedar mal a otro. Es una virtud social y se ense\xF1a desde ni\xF1o.","Sus consecuencias pr\xE1cticas: casi nadie te dir\xE1 que no directamente; recibir\xE1s respuestas vagas en lugar de negativas; un empleado no corregir\xE1 a su jefe aunque sepa que se equivoca; alguien te dar\xE1 indicaciones inventadas antes que admitir que no sabe. Insistir hasta arrancar un \xABno\xBB expl\xEDcito se considera bastante brusco."]},{t:"Jai yen: el coraz\xF3n fr\xEDo gana",p:["Levantar la voz en p\xFAblico hace perder prestigio al que grita, no al que recibe. La reacci\xF3n esperada ante un problema es jai yen yen: bajar el tono, sonre\xEDr, arreglarlo despu\xE9s.","Y ojo con la sonrisa tailandesa, porque no siempre significa alegr\xEDa. Hay sonrisa de disculpa, de verg\xFCenza ajena, de incomodidad y de \xABno tengo ni idea de qu\xE9 me est\xE1s diciendo\xBB. Que alguien sonr\xEDa no quiere decir que la cosa vaya bien."],dato:"Las dos palabras que m\xE1s vas a o\xEDr: san\xF9k (que algo sea divertido, condici\xF3n casi obligatoria de cualquier actividad) y m\xE2i pen ray (no pasa nada, d\xE9jalo estar)."},{t:"El himno, dos veces al d\xEDa",p:["A las ocho de la ma\xF1ana y a las seis de la tarde suena el himno nacional por megafon\xEDa en estaciones, parques, escuelas y espacios p\xFAblicos. Todo el mundo se detiene y se queda de pie en silencio durante un minuto. Se espera lo mismo de un extranjero.","En los cines, antes de la pel\xEDcula, se proyecta el himno real y el p\xFAblico se levanta. No es opcional en la pr\xE1ctica."]},{t:"La monarqu\xEDa y la ley",p:["La imagen del rey est\xE1 en billetes, monedas, retratos gigantes y calendarios. De ah\xED salen dos normas que sorprenden: no se pisa un billete que se te ha ca\xEDdo para pararlo, y no se rompen ni se manchan retratos.","El art\xEDculo 112 del c\xF3digo penal castiga con hasta quince a\xF1os de c\xE1rcel criticar al rey o a su familia. Se ha aplicado a extranjeros y a publicaciones en redes. Es el asunto sobre el que conviene no bromear ni opinar en p\xFAblico bajo ninguna circunstancia."]},{t:"En el templo",art:"templo",p:["Hombros y rodillas cubiertos, siempre. Los zapatos fuera antes de entrar al edificio principal, y a veces tambi\xE9n dentro del recinto. No se se\xF1ala con el dedo a las im\xE1genes ni se les da la espalda para hacerse una foto.","Se puede hacer una ofrenda de flores de loto, incienso y pan de oro, y se puede sentar a mirar todo el tiempo que quieras. Los templos son espacios vivos: hay gente comiendo, perros durmiendo y ni\xF1os corriendo. No es una catedral en silencio."]},{t:"Los monjes",art:"monje",p:["Al amanecer salen a recibir limosna con un cuenco. No es mendicidad sino un intercambio: el laico gana m\xE9rito dando comida. Se ofrece descalzo, con las manos, y sin esperar un agradecimiento, porque el que recibe est\xE1 haci\xE9ndote un favor a ti.","Una mujer no debe tocar a un monje ni entregarle nada directamente en la mano: se deja el objeto sobre una tela o superficie y \xE9l lo recoge. En autobuses y metro hay asientos reservados para ellos.","Muchos hombres pasan una temporada como monjes en alg\xFAn momento de su vida, a veces solo unas semanas, sobre todo para generar m\xE9rito a nombre de sus padres."]},{t:"La mesa",art:"mesa",p:["Los platos van al centro y se comparten; lo \xFAnico individual es el bol de arroz. Se sirve poca cantidad cada vez, una cucharada, y se vuelve a servir: llenar el plato de golpe se ve como avaricia.","La cuchara va en la mano derecha y es la que entra en la boca. El tenedor va en la izquierda y solo sirve para empujar la comida hacia la cuchara: no se lleva a los labios. Los palillos se reservan para los fideos y para la comida de origen chino.","En una mesa se busca el equilibrio del conjunto: algo picante, algo suave, algo agrio, un frito, una sopa. Por eso pedir cinco curries te delata como turista."],dato:"Quien invita suele pagar la cuenta entera, y discutirlo demasiado es inc\xF3modo. Se agradece y ya est\xE1."},{t:"La casa de los esp\xEDritus",art:"casa",p:["Esa casita en miniatura sobre un pedestal que hay en la esquina de casi todos los edificios es el san phra phum, la vivienda del esp\xEDritu guardi\xE1n del terreno. La idea es sencilla: al construir has ocupado su sitio, as\xED que le das uno mejor.","Se le ofrecen flores, incienso, arroz, fruta y, muy a menudo, refrescos rojos con pajita. La orientaci\xF3n y el momento de instalarla los decide un experto en astrolog\xEDa, y no se mueve nunca sin ceremonia."]},{t:"Amuletos y tatuajes",p:["El budismo tailand\xE9s convive con el animismo y con elementos hind\xFAes sin que a nadie le parezca contradictorio. Hay mercados enteros dedicados a amuletos, peque\xF1as im\xE1genes bendecidas por un monje concreto que se llevan colgadas y que pueden alcanzar precios alt\xEDsimos.","Los tatuajes sak yant se hacen a mano con una vara larga y llevan f\xF3rmulas en escritura khom. Se considera que protegen, y con ellos vienen reglas de conducta. Colocarse una imagen de Buda tatuada por debajo de la cintura se considera una falta grave de respeto."]},{t:"Cosas que se hacen sin pensar",p:["Descalzarse al entrar en una casa, en muchos comercios peque\xF1os y en cualquier templo. No pisar el umbral de las puertas de los templos, hay que pasarlo por encima: la creencia es que ah\xED vive un esp\xEDritu.","Dar y recibir con la mano derecha, apoyando la izquierda en el antebrazo si quieres ser especialmente cort\xE9s. No se\xF1alar a personas con el dedo \xEDndice, se hace con la mano abierta. Y no llamar a alguien con la palma hacia arriba: se hace con la palma hacia abajo moviendo los dedos."]}]},{id:"fiestas",name:"Fiestas",blurb:"Ordenadas por lo que le importan a ellos, no al turismo.",art:"songkran",secs:[{t:"Songkran, el a\xF1o nuevo",art:"songkran",p:["Del 13 al 15 de abril, en el mes m\xE1s caluroso del a\xF1o. Es la fiesta m\xE1s importante del calendario y funciona sobre todo como fiesta familiar: es cuando el pa\xEDs entero deja de trabajar y millones de personas vuelven a su pueblo. Los autobuses y trenes se llenan durante una semana.","El origen es un gesto de respeto: verter agua perfumada sobre las manos de los mayores para pedirles su bendici\xF3n, y ba\xF1ar las im\xE1genes de Buda. La batalla de agua callejera es la versi\xF3n moderna y multitudinaria de eso, con pistolas, cubos y camionetas cargadas de barriles.","Chiang Mai es el epicentro. Tambi\xE9n es, tristemente, la semana con m\xE1s accidentes de tr\xE1fico del a\xF1o."],dato:"Nadie se libra. Si sales a la calle en esos d\xEDas, te van a mojar. Protege el m\xF3vil en una bolsa estanca y d\xE9jate llevar."},{t:"Loi Krathong y Yi Peng",art:"krathong",p:["En la luna llena del duod\xE9cimo mes lunar, normalmente en noviembre, se dejan flotar en r\xEDos y canales peque\xF1as balsas de hoja de pl\xE1tano con velas, incienso y flores. El gesto significa pedir perd\xF3n a la diosa del agua y dejar ir la mala suerte, los rencores y los errores del a\xF1o.","En Chiang Mai coincide con la fiesta lanna de Yi Peng, cuando se sueltan al cielo miles de farolillos de papel. Las dos im\xE1genes que has visto mil veces en fotos, la del r\xEDo y la del cielo, son en realidad dos fiestas distintas que se solapan."]},{t:"Los tres d\xEDas grandes del budismo",p:["Makha Bucha (febrero o marzo) conmemora la reuni\xF3n espont\xE1nea de mil doscientos cincuenta disc\xEDpulos ante Buda. Visakha Bucha (mayo) es el m\xE1s sagrado de todos: celebra a la vez el nacimiento, la iluminaci\xF3n y la muerte de Buda. Asalha Bucha (julio) recuerda su primer serm\xF3n.","En los tres, la gente lleva ofrendas al templo y por la noche da tres vueltas alrededor del edificio principal con una vela, una flor de loto y tres varillas de incienso. Son d\xEDas festivos nacionales y no se vende alcohol en todo el pa\xEDs."]},{t:"Khao Phansa: la cuaresma budista",p:["Justo despu\xE9s de Asalha Bucha empiezan tres meses, de julio a octubre, en los que los monjes deben permanecer en su templo. Coincide con la estaci\xF3n de lluvias y el origen es pr\xE1ctico: evitar que pisaran los brotes de arroz al caminar.","Mucha gente laica aprovecha para dejar el alcohol durante los tres meses; hay una campa\xF1a nacional que lo promueve. Es tambi\xE9n la temporada tradicional para ordenarse monje temporalmente."]},{t:"El festival vegetariano",p:["Nueve d\xEDas de octubre, marcados por banderas amarillas en los puestos de comida. Lo trajo la comunidad de origen chino y su centro es Phuket, donde incluye procesiones con participantes en trance que se perforan el cuerpo, algo bastante impactante de ver.","Para el resto del pa\xEDs es sobre todo una temporada gastron\xF3mica: durante nueve d\xEDas es facil\xEDsimo comer vegetariano en cualquier sitio."]},{t:"Los d\xEDas del rey y de la reina",p:["El 5 de diciembre, cumplea\xF1os de Rama IX, es fiesta nacional y D\xEDa del Padre. El 12 de agosto, cumplea\xF1os de la reina Sirikit, es D\xEDa de la Madre. En ambos se llevan flores: canna amarillas para el padre, jazm\xEDn para la madre.","Adem\xE1s est\xE1 el 6 de abril, d\xEDa de la dinast\xEDa Chakri; el 28 de julio, cumplea\xF1os del rey actual; y el 23 de octubre, aniversario de la muerte de Rama V, en el que la gente deja ofrendas ante su estatua ecuestre en Bangkok."]},{t:"A\xF1o nuevo chino",p:["No es fiesta oficial en todo el pa\xEDs, pero en Bangkok se nota much\xEDsimo. Un porcentaje enorme de la poblaci\xF3n de la capital tiene ascendencia china, y Yaowarat, el barrio chino, se cierra al tr\xE1fico durante d\xEDas con desfiles de dragones, comida por todas partes y todo te\xF1ido de rojo.","Phuket y Hat Yai tambi\xE9n lo celebran a lo grande."]},{t:"Las fiestas raras que merecen un viaje",p:["Phi Ta Khon, en Dan Sai, provincia de Loei, hacia junio: una procesi\xF3n de m\xE1scaras de fantasmas gigantes hechas con cascos de arroz y coco pintado. Es una mezcla de rito animista y celebraci\xF3n budista, y no se parece a nada.","Bun Bang Fai, el festival de los cohetes de Isan en mayo: se lanzan cohetes caseros enormes al cielo para pedir lluvia antes de la siembra. Al que le falla el cohete lo tiran al barro.","Y hay dos que son sobre todo espect\xE1culo: la reuni\xF3n de elefantes de Surin en noviembre y el banquete de los monos de Lopburi, donde se monta un buf\xE9 de fruta para los macacos que ocupan la ciudad."]},{t:"Los d\xEDas sin alcohol",p:["Conviene saberlo antes de que te pase: en los d\xEDas festivos budistas y en las jornadas electorales no se vende alcohol en ning\xFAn sitio del pa\xEDs, ni en supermercados ni en bares.","Y a diario hay dos franjas horarias de venta legal en tiendas: de once a dos y de cinco a medianoche. Fuera de eso, la caja del supermercado se niega."]}]},{id:"pais",name:"El pa\xEDs",blurb:"Cuatro regiones que se parecen poco entre s\xED.",art:"mapa",secs:[{t:"Cuatro pa\xEDses en uno",art:"mapa",p:["El norte es monta\xF1oso y fresco, con Chiang Mai como capital cultural y una historia propia, la de Lanna. Es la regi\xF3n de los pueblos de monta\xF1a, del khao soi y de las temperaturas que en invierno bajan de verdad.","Isan, el noreste, es la meseta seca junto al Mekong. Es la regi\xF3n m\xE1s poblada y la m\xE1s pobre, culturalmente lao, y de ella salen buena parte de los trabajadores de Bangkok.","El centro es la llanura de arroz del r\xEDo Chao Phraya: el coraz\xF3n hist\xF3rico, econ\xF3mico y pol\xEDtico, con Ayutthaya y Bangkok.","El sur es una pen\xEDnsula estrecha entre dos mares, con una fuerte poblaci\xF3n musulmana malaya, caucho, pesca y las islas de postal."]},{t:"Los dos mares",p:["La costa oeste da al mar de Andam\xE1n: acantilados de caliza que salen del agua, Phuket, Krabi, Ko Lanta, Ko Phi Phi. Su temporada buena va de noviembre a abril.","La costa este da al golfo de Tailandia: Ko Samui, Ko Pha-ngan, Ko Tao. Funciona casi al rev\xE9s, con lo peor entre octubre y diciembre.","Es decir: elegir isla en Tailandia es sobre todo elegir en qu\xE9 lado del monz\xF3n quieres estar ese mes."],dato:"En el istmo de Kra, el pa\xEDs mide poco m\xE1s de 40 km de ancho: puedes ver los dos mares casi a la vez."},{t:"Tres estaciones, no cuatro",p:["Fresca de noviembre a febrero, que es la mejor \xE9poca y tambi\xE9n la m\xE1s cara. Calurosa de marzo a mayo, con m\xE1s de 40 \xB0C en Isan y una humedad que se pega. Lluviosa de mayo a octubre.","La estaci\xF3n de lluvias no significa d\xEDas grises enteros: normalmente es un chaparr\xF3n brutal de una hora por la tarde y luego escampa. Es la temporada m\xE1s barata y la m\xE1s verde."]},{t:"Bangkok",p:["M\xE1s de diez millones de habitantes en el \xE1rea metropolitana, unas cuarenta veces la segunda ciudad del pa\xEDs. Es un caso extremo de primac\xEDa urbana: casi todo lo que pasa en Tailandia pasa all\xED.","Se hunde entre uno y dos cent\xEDmetros al a\xF1o, est\xE1 construida sobre una llanura pantanosa a apenas metro y medio sobre el nivel del mar, y su red de canales, los klongs, fue en su d\xEDa el sistema de transporte principal. Hoy quedan unos pocos y el barco sigue siendo la forma m\xE1s r\xE1pida de cruzarla en hora punta."]},{t:"La gente",p:["Unos 66 millones de habitantes. La mayor\xEDa se identifica como tai, pero el pa\xEDs es m\xE1s diverso de lo que se cuenta: hay una enorme poblaci\xF3n de ascendencia china, sobre todo urbana y muy integrada; los isan, de lengua y cultura lao, que son la mayor minor\xEDa ling\xFC\xEDstica; malayos musulmanes en las provincias del extremo sur; y pueblos de monta\xF1a en el norte como los karen, hmong, akha o lahu.","El budismo theravada lo practica alrededor del 93 %, y el islam en torno al 5 %, concentrado en el sur."]},{t:"Datos para ubicarte",p:["77 provincias. Superficie parecida a la de Espa\xF1a. El punto m\xE1s alto es el Doi Inthanon, 2.565 metros, en el norte. El r\xEDo m\xE1s importante es el Chao Phraya y el Mekong marca gran parte de la frontera con Laos.","Fronteras con Birmania, Laos, Camboya y Malasia. La isla m\xE1s grande es Phuket, que en realidad est\xE1 unida al continent
