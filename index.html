e por un puente."]}]},{id:"curiosidades",name:"Curiosidades",blurb:"Cosas peque\xF1as que te van a pasar en la primera semana.",art:"colores",secs:[{t:"Est\xE1s en el a\xF1o 2569",p:["Tailandia usa oficialmente la era budista, que empieza con la muerte de Buda: se le suman 543 a\xF1os al calendario occidental. As\xED que 2026 es el a\xF1o 2569.","Lo ver\xE1s en recibos, carn\xE9s, fechas de caducidad y peri\xF3dicos. Si un documento pone 2569, no est\xE1 mal escrito."]},{t:"El color de tu d\xEDa de nacimiento",art:"colores",p:["Cada d\xEDa de la semana tiene un color, un planeta y un Buda propio: amarillo el lunes, rosa el martes, verde el mi\xE9rcoles, naranja el jueves, azul claro el viernes, morado el s\xE1bado y rojo el domingo.","Mucha gente sabe en qu\xE9 d\xEDa de la semana naci\xF3 y lo considera parte de su identidad, as\xED que es una pregunta social habitual. Rama IX naci\xF3 en lunes, y por eso durante su reinado el amarillo se asoci\xF3 con la monarqu\xEDa y se ve\xEDa por todas partes los lunes."],dato:"Si no sabes en qu\xE9 d\xEDa naciste, b\xFAscalo antes de que te lo pregunten: te van a preguntar."},{t:"555 es una carcajada",p:["El cinco se dice h\xE2a, as\xED que escribir 555 en un chat equivale a nuestro jajaja. Cuantos m\xE1s cincos, m\xE1s gracia.","El mismo juego funciona con otros n\xFAmeros en publicidad y matr\xEDculas, porque hay una cultura fuerte de n\xFAmeros afortunados: el 9 (k\xE2aw) suena parecido a \xABavanzar\xBB y por eso es el m\xE1s buscado."]},{t:"El elefante blanco era un regalo envenenado",art:"elefante",p:["Los elefantes blancos son sagrados y por tradici\xF3n pertenecen al rey. La leyenda cuenta que un monarca regalaba uno a un cortesano que le ca\xEDa mal: no pod\xEDa rechazarlo, no pod\xEDa ponerlo a trabajar por ser sagrado y mantenerlo lo arruinaba.","De ah\xED viene la expresi\xF3n inglesa \xABwhite elephant\xBB para referirse a una posesi\xF3n car\xEDsima e in\xFAtil. El elefante fue adem\xE1s el s\xEDmbolo de la bandera siamesa hasta 1917."]},{t:"Hay un 7-Eleven cada dos manzanas",p:["Tailandia tiene m\xE1s de 14.000 tiendas 7-Eleven, la tercera cifra m\xE1s alta del mundo tras Jap\xF3n y Estados Unidos. En algunas calles de Bangkok hay dos, uno enfrente del otro.","Funcionan como centro log\xEDstico del pa\xEDs: pagas facturas, recargas el m\xF3vil, compras billetes, sacas dinero y desayunas un s\xE1ndwich tostado a las cuatro de la ma\xF1ana."]},{t:"C\xF3mo funcionan las direcciones",p:["Una direcci\xF3n t\xEDpica es \xABSukhumvit Soi 23\xBB. thanon Sukhumvit es la calle principal y el soi es el callej\xF3n que sale de ella, numerado. Los pares suelen quedar a un lado y los impares al otro, as\xED que el soi 22 y el 23 est\xE1n enfrentados pero no comunicados.","Muchos soi son largu\xEDsimos y sin salida, as\xED que la distancia real entre dos direcciones cercanas sobre el mapa puede ser un rodeo enorme. Esto explica buena parte de los precios de los mototaxis."]},{t:"El hielo con agujero es seguro",p:["El agua del grifo no se bebe, pero el hielo cil\xEDndrico con un agujero en el medio que ponen en los vasos es hielo industrial hecho con agua tratada y est\xE1 regulado. El que hay que mirar con m\xE1s cuidado es el hielo picado o en trozos irregulares de origen incierto.","El agua embotellada es barat\xEDsima y est\xE1 en todas partes, y en muchos sitios hay m\xE1quinas de recarga por unas monedas."]},{t:"Se conduce por la izquierda",p:["Herencia de la influencia brit\xE1nica en la regi\xF3n, aunque el pa\xEDs nunca fuera colonia. Mira siempre a la derecha antes de cruzar; el instinto europeo falla justo al rev\xE9s.","Los cruces de peatones existen pero no siempre se respetan. La t\xE9cnica local es cruzar despacio, sin correr y sin cambiar de ritmo, para que las motos puedan calcular por d\xF3nde pasarte."]},{t:"El muay thai empieza bailando",p:["Antes de cada combate, el luchador ejecuta el wai kru ram muay: una danza ritual con la que saluda a su maestro, delimita el ring y ahuyenta a los malos esp\xEDritus. La m\xFAsica en directo, con el chirim\xEDa y los tambores, acelera seg\xFAn avanza el combate.","Es deporte nacional y tambi\xE9n una v\xEDa de ascenso social; muchos p\xFAgiles vienen de familias campesinas de Isan y empiezan a competir de ni\xF1os."]},{t:"Los kathoey",p:["Tailandia tiene una visibilidad de personas trans mayor que casi cualquier otro pa\xEDs, con presencia normalizada en televisi\xF3n, comercio y vida cotidiana. La palabra kathoey se usa de forma amplia y no siempre con las mismas connotaciones que en Europa.","Conviene matizar: visibilidad social no ha significado igualdad legal autom\xE1tica, y el reconocimiento jur\xEDdico ha ido bastante por detr\xE1s de la aceptaci\xF3n cotidiana."]},{t:"Detalles que sorprenden",p:["En los ascensores de muchos hoteles no hay planta 13. En los hospitales tampoco es raro que falte.","El pa\xEDs tiene m\xE1s de 40.000 templos budistas en activo. Hay m\xE1s templos que colegios.","Las bolsas de pl\xE1stico con pajita: mucha bebida para llevar se sirve en bolsa, no en vaso, porque el vaso se queda en el puesto.","El nombre de casi todos los taxis: no todos usan tax\xEDmetro. Antes de subir, di \xABmeter\xBB y confirma que lo bajan."]}]}],cs=[{q:"\xBFDe d\xF3nde vino el chile a la cocina tailandesa?",o:["Siempre estuvo all\xED","De Am\xE9rica, con los portugueses","De la India","De China"],a:1},{q:"\xBFPor qu\xE9 se invent\xF3 el pad thai?",o:["Era un plato de la corte real","Por una campa\xF1a nacionalista en los a\xF1os 40","Lo trajeron los chinos en el siglo XVIII","Nadie lo sabe"],a:1},{q:"\xBFQu\xE9 significa 't\xF4m yam' literalmente?",o:["Sopa de gambas","Hervido y mezclado picante","Caldo del rey","Agrio y dulce"],a:1},{q:"\xBFDe qu\xE9 cultura lleg\xF3 el curry massaman?",o:["China","Persa y musulmana","Japonesa","Vietnamita"],a:1},{q:"\xBFQui\xE9n introdujo los dulces tailandeses de yema de huevo?",o:["Un monje de Sukhothai","Una mujer portuguesa en Ayutthaya","Comerciantes chinos","La corte de Rama V"],a:1},{q:"\xBFQu\xE9 significa 'ph\xE0t' al principio del nombre de un plato?",o:["Frito en abundante aceite","Salteado al wok","Hervido","A la brasa"],a:1},{q:"\xBFQu\xE9 quiere decir 'Krung Thep'?",o:["Ciudad del r\xEDo","Ciudad de los \xE1ngeles","Gran mercado","Puerta del sur"],a:1},{q:"\xBFDe d\xF3nde viene el nombre 'Bangkok'?",o:["De un rey","De una aldea de olivos silvestres","Del r\xEDo","Es una palabra inglesa"],a:1},{q:"\xBFQu\xE9 significa 'ko' en un top\xF3nimo tailand\xE9s?",o:["Monta\xF1a","Isla","Playa","Templo"],a:1},{q:"\xBFDesde cu\xE1ndo hay apellidos en Tailandia?",o:["Desde siempre","Desde 1913","Desde 1932","Desde 1939"],a:1},{q:"\xBFQu\xE9 reino fund\xF3 Chiang Mai en 1296?",o:["Sukhothai","Lanna","Ayutthaya","Srivijaya"],a:1},{q:"\xBFQu\xE9 pas\xF3 en Ayutthaya en 1767?",o:["Se fund\xF3 la ciudad","Fue arrasada por Birmania","Se declar\xF3 capital","Lleg\xF3 el primer rey Chakri"],a:1},{q:"\xBFQu\xE9 distingue a Tailandia del resto del sudeste asi\xE1tico?",o:["Nunca fue colonizada","Fue colonia francesa","Fue colonia brit\xE1nica","Fue colonia portuguesa"],a:0},{q:"\xBFQu\xE9 cambi\xF3 en Tailandia en 1932?",o:["Cambi\xF3 de nombre","Se aboli\xF3 la monarqu\xEDa","Pas\xF3 a ser monarqu\xEDa constitucional","Se traslad\xF3 la capital"],a:2},{q:"\xBFEn qu\xE9 a\xF1o Siam pas\xF3 a llamarse Tailandia?",o:["1913","1932","1939","1946"],a:2},{q:"\xBFCu\xE1nto rein\xF3 Rama IX?",o:["30 a\xF1os","50 a\xF1os","70 a\xF1os","20 a\xF1os"],a:2},{q:"\xBFA qui\xE9n se le devuelve el wai?",o:["A todo el mundo","A un monje o a alguien mayor","Solo a los ni\xF1os","Solo a extranjeros"],a:1},{q:"\xBFQu\xE9 parte del cuerpo se considera impura?",o:["Las manos","La cabeza","Los pies","La espalda"],a:2},{q:"\xBFQu\xE9 es 'kreng jai'?",o:["Un plato de Isan","La reticencia a incomodar a otro","Una fiesta de mayo","Un tipo de templo"],a:1},{q:"\xBFPara qu\xE9 sirve el tenedor en una mesa tailandesa?",o:["Para llevarse la comida a la boca","Para empujar hacia la cuchara","Para servir del plato com\xFAn","No se usa nunca"],a:1},{q:"\xBFCu\xE1ndo se celebra Songkran?",o:["En enero","En abril","En julio","En noviembre"],a:1},{q:"\xBFQu\xE9 se hace en Loi Krathong?",o:["Se lanzan cohetes","Se dejan flotar balsas con velas","Se reparte comida a los monos","Se corre delante de elefantes"],a:1},{q:"\xBFQu\xE9 es el san phra phum?",o:["Un tipo de curry","Una casa de esp\xEDritus","Un saludo formal","Un templo real"],a:1},{q:"\xBFEn qu\xE9 a\xF1o est\xE1s si el recibo pone 2569?",o:["2026","2069","1969","2540"],a:0},{q:"\xBFQu\xE9 significa escribir '555' en un chat?",o:["Urgente","Jajaja","Gracias","Adi\xF3s"],a:1},{q:"\xBFPor qu\xE9 el elefante blanco era un mal regalo?",o:["Tra\xEDa mala suerte","No pod\xEDas usarlo ni rechazarlo y arruinaba","Era ilegal","Se escapaba siempre"],a:1},{q:"\xBFQu\xE9 color corresponde al lunes?",o:["Rojo","Amarillo","Verde","Azul"],a:1},{q:"\xBFCu\xE1l es la mejor temporada en la costa de Andam\xE1n?",o:["De noviembre a abril","De mayo a octubre","Todo el a\xF1o igual","Solo en agosto"],a:0}];var rd=[{id:"puesto",name:"El puesto de comida",blurb:"Donde de verdad vas a hablar tailand\xE9s."},{id:"gente",name:"La gente",blurb:"Lo que te van a preguntar a ti."},{id:"calle",name:"La calle",blurb:"Moverte, comprar, encontrar."},{id:"apuros",name:"Cuando se tuerce",blurb:"No entender tambi\xE9n es una situaci\xF3n."}],ea=[{id:"m-pedir",bloque:"puesto",title:"Pedir un plato",donde:"Cualquier puesto de comida",meta:"Salir con tu plato sin haber se\xF1alado con el dedo.",intro:"Todo lo que pidas en Tailandia el resto de tu vida empieza por kh\u0254\u030C\u0254. Significa \xABpido\xBB y no suena brusco: es la forma normal y educada. Detr\xE1s va la comida, despu\xE9s el n\xFAmero, despu\xE9s el clasificador, y al final khr\xE1p.",tuyas:[{rom:"kh\u0254\u030C\u0254 ph\xE0t k\xE0-phrao m\u01D4u n\u0268\u0300\u014B caan khr\xE1p",thai:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E01\u0E30\u0E40\u0E1E\u0E23\u0E32\u0E2B\u0E21\u0E39\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E08\u0E32\u0E19\u0E04\u0E23\u0E31\u0E1A",es:"Un pad kaphrao de cerdo, por favor",uso:"La estructura completa. Cambia el plato y ya sabes pedir cualquier cosa."},{rom:"kh\u0254\u030C\u0254 k\u01D4ay-t\u01D0aw n\u0268\u0300\u014B chaam khr\xE1p",thai:"\u0E02\u0E2D\u0E01\u0E4B\u0E27\u0E22\u0E40\u0E15\u0E35\u0E4B\u0E22\u0E27\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E0A\u0E32\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"Un cuenco de fideos, por favor",uso:"Sopas y fideos van en chaam, no en caan."},{rom:"\u0294aw \u0294an-n\xEDi khr\xE1p",thai:"\u0E40\u0E2D\u0E32\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E04\u0E23\u0E31\u0E1A",es:"Quiero este",uso:"Cuando no sabes el nombre. Vale, se usa, no pasa nada."},{rom:"kh\u0254\u030C\u0254 s\u0254\u030C\u0254\u014B caan khr\xE1p",thai:"\u0E02\u0E2D\u0E2A\u0E2D\u0E07\u0E08\u0E32\u0E19\u0E04\u0E23\u0E31\u0E1A",es:"Dos platos",uso:"Si vas con alguien."},{rom:"kh\u0254\u030C\u0254 \u0294\xECik n\u0268\u0300\u014B khr\xE1p",thai:"\u0E02\u0E2D\u0E2D\u0E35\u0E01\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E04\u0E23\u0E31\u0E1A",es:"Otro m\xE1s",uso:"\u0294\xECik = \xABotro/m\xE1s\xBB. Muy socorrida."}],oyes:[{rom:"r\xE1p \u0294\xE0-ray dii khr\xE1p",thai:"\u0E23\u0E31\u0E1A\u0E2D\u0E30\u0E44\u0E23\u0E14\u0E35\u0E04\u0E23\u0E31\u0E1A",es:"\xBFQu\xE9 le pongo?",que:"La pregunta de bienvenida. Contesta directamente con tu kh\u0254\u030C\u0254."},{rom:"\u0294aw \u0294\xE0-ray khr\xE1p",thai:"\u0E40\u0E2D\u0E32\u0E2D\u0E30\u0E44\u0E23\u0E04\u0E23\u0E31\u0E1A",es:"\xBFQu\xE9 quiere?",que:"La misma pregunta, m\xE1s corta."},{rom:"kin th\xEEi-n\xEEi r\u0268\u030C\u0268 kl\xE0p b\xE2an",thai:"\u0E01\u0E34\u0E19\u0E17\u0E35\u0E48\u0E19\u0E35\u0E48\u0E2B\u0E23\u0E37\u0E2D\u0E01\u0E25\u0E31\u0E1A\u0E1A\u0E49\u0E32\u0E19",es:"\xBFAqu\xED o para llevar?",que:"Te lo van a preguntar casi siempre. Tienes la respuesta en la misi\xF3n siguiente."},{rom:"r\u0254\u0254 s\xE1k-khr\xFBu n\xE1",thai:"\u0E23\u0E2D\u0E2A\u0E31\u0E01\u0E04\u0E23\u0E39\u0E48\u0E19\u0E30",es:"Un momentito",que:"Ya est\xE1 pedido. Rel\xE1jate."}],ojo:["El orden es: comida + n\xFAmero + clasificador. ph\xE0t thai n\u0268\u0300\u014B caan. Nunca \xABun plato de pad thai\xBB.","caan (\u0E08\u0E32\u0E19) es el plato llano de lo que va sobre arroz. chaam (\u0E0A\u0E32\u0E21) el cuenco de sopas y fideos. th\u01D4\u014B (\u0E16\u0E38\u0E07) la bolsa si te lo llevas.","En tailand\xE9s no existe \xABpor favor\xBB al final. La cortes\xEDa es khr\xE1p, y va en casi todas las frases que digas."],calle:"Hoy pide un plato empezando por kh\u0254\u030C\u0254. Aunque se\xF1ales a la vez, aunque lo digas mal. Una vez."},{id:"m-picante",bloque:"puesto",title:"Que no pique tanto",donde:"Puestos, som tam, curry",meta:"Comerte el plato entero sin sudar.",intro:"El picante tailand\xE9s no es una nota de color: es el plato. Y aqu\xED est\xE1 la trampa que descubre todo extranjero: m\xE2i ph\xE8t (\xABno picante\xBB) sigue picando, porque la escala de referencia no es la tuya. Si de verdad no quieres nada, hay que decirlo con m\xE1s fuerza.",tuyas:[{rom:"m\xE2i ph\xE8t n\xE1 khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14\u0E19\u0E30\u0E04\u0E23\u0E31\u0E1A",es:"Que no pique, \xBFvale?",uso:"El est\xE1ndar. Pica un poco igual."},{rom:"m\xE2i ph\xE8t l\u0259\u0259y khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14\u0E40\u0E25\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"Nada de picante",uso:"l\u0259\u0259y es \xABen absoluto\xBB. Esta es la que funciona de verdad."},{rom:"ph\xE8t n\xEDt-n\u0254\u0300y khr\xE1p",thai:"\u0E40\u0E1C\u0E47\u0E14\u0E19\u0E34\u0E14\u0E2B\u0E19\u0E48\u0E2D\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"Un poquito picante",uso:"El punto donde vas a querer quedarte a los tres meses."},{rom:"s\xE0y phr\xEDk s\u0254\u030C\u0254\u014B m\xE9t khr\xE1p",thai:"\u0E43\u0E2A\u0E48\u0E1E\u0E23\u0E34\u0E01\u0E2A\u0E2D\u0E07\u0E40\u0E21\u0E47\u0E14\u0E04\u0E23\u0E31\u0E1A",es:"Ponle dos chiles",uso:"En el som tam se cuenta por chiles, no por nivel."},{rom:"ph\xE8t m\xE2ak d\xE2ay khr\xE1p",thai:"\u0E40\u0E1C\u0E47\u0E14\u0E21\u0E32\u0E01\u0E44\u0E14\u0E49\u0E04\u0E23\u0E31\u0E1A",es:"Puede picar mucho",uso:"El d\xEDa que quieras ganarte una sonrisa."}],oyes:[{rom:"ph\xE8t d\xE2ay m\xE1y",thai:"\u0E40\u0E1C\u0E47\u0E14\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21",es:"\xBFAguantas el picante?",que:"No es un reto, es amabilidad. Responde d\xE2ay khr\xE1p o m\xE2i d\xE2ay khr\xE1p."},{rom:"\u0294aw ph\xE8t m\xE1y",thai:"\u0E40\u0E2D\u0E32\u0E40\u0E1C\u0E47\u0E14\u0E44\u0E2B\u0E21",es:"\xBFLo quiere picante?"},{rom:"k\xECi m\xE9t",thai:"\u0E01\u0E35\u0E48\u0E40\u0E21\u0E47\u0E14",es:"\xBFCu\xE1ntos chiles?",que:"Som tam. Uno ya se nota. Tres es picante de verdad."}],ojo:["phr\xEDk (\u0E1E\u0E23\u0E34\u0E01) es el chile. m\xE9t (\u0E40\u0E21\u0E47\u0E14) es la unidad con que se cuentan las cosas peque\xF1as y redondas.","n\xE1 al final ablanda la frase. Sin n\xE1, \xABm\xE2i ph\xE8t\xBB suena a instrucci\xF3n; con n\xE1, a petici\xF3n.","El chile lleg\xF3 a Tailandia desde Am\xE9rica con los portugueses en el siglo XVI. La cocina picante tailandesa tiene menos de 500 a\xF1os."],calle:"Pide algo diciendo t\xFA el nivel de picante antes de que te lo pregunten."},{id:"m-dulce",bloque:"puesto",title:"Poco dulce, sin hielo",donde:"Carritos de caf\xE9 y t\xE9, batidos",meta:"Beberte un t\xE9 tailand\xE9s sin que sea un postre.",intro:"El az\xFAcar en las bebidas de calle es estructural: leche condensada, sirope y az\xFAcar en el mismo vaso. w\u01CEan n\u0254\u0301\u0254y es probablemente la frase que m\xE1s veces vas a decir en tu vida en Tailandia.",tuyas:[{rom:"w\u01CEan n\u0254\u0301\u0254y khr\xE1p",thai:"\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"Poco dulce",uso:"Se dice sola, sin m\xE1s. Es una petici\xF3n est\xE1ndar."},{rom:"m\xE2i s\xE0y n\xE1m-taan khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E15\u0E32\u0E25\u0E04\u0E23\u0E31\u0E1A",es:"Sin az\xFAcar",uso:"m\xE2i s\xE0y X sirve para quitar cualquier cosa de cualquier plato."},{rom:"m\xE2i s\xE0y nom khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"Sin leche"},{rom:"m\xE2i s\xE0y n\xE1m-kh\xE6\u030C\u014B khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07\u0E04\u0E23\u0E31\u0E1A",es:"Sin hielo"},{rom:"kh\u0254\u030C\u0254 n\xE1m-kh\xE6\u030C\u014B ph\u0259\u0302\u0259m khr\xE1p",thai:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07\u0E40\u0E1E\u0E34\u0E48\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"M\xE1s hielo",uso:"ph\u0259\u0302\u0259m = \xABa\xF1ade\xBB. Tambi\xE9n vale para arroz."}],oyes:[{rom:"w\u01CEan p\xF2k-k\xE0-t\xEC m\xE1y",thai:"\u0E2B\u0E27\u0E32\u0E19\u0E1B\u0E01\u0E15\u0E34\u0E44\u0E2B\u0E21",es:"\xBFDulzor normal?"},{rom:"s\xE0y nom m\xE1y",thai:"\u0E43\u0E2A\u0E48\u0E19\u0E21\u0E44\u0E2B\u0E21",es:"\xBFCon leche?"},{rom:"r\u0254\u0301\u0254n r\u0268\u030C\u0268 yen",thai:"\u0E23\u0E49\u0E2D\u0E19\u0E2B\u0E23\u0E37\u0E2D\u0E40\u0E22\u0E47\u0E19",es:"\xBFCaliente o fr\xEDo?",que:"yen es fr\xEDo. En Bangkok la respuesta suele ser obvia."}],ojo:["s\xE0y (\u0E43\u0E2A\u0E48) significa \xABmeter, echar dentro\xBB. m\xE2i s\xE0y + cualquier ingrediente = \xABsin eso\xBB. Es la f\xF3rmula m\xE1s rentable del idioma para comer.","n\u0254\u0301\u0254y es \xABpoco\xBB. n\xEDt-n\u0254\u0300y es \xABun poquito\xBB. Se parecen y no son lo mismo: w\u01CEan n\u0254\u0301\u0254y = menos dulce de lo normal."],calle:"P\xEDdete un caf\xE9 o un t\xE9 con w\u01CEan n\u0254\u0301\u0254y. Nota la diferencia."},{id:"m-llevar",bloque:"puesto",title:"Para llevar",donde:"Puestos y mercados",meta:"Contestar t\xFA a la pregunta antes de que te la repitan en ingl\xE9s.",intro:"\xABPara llevar\xBB en tailand\xE9s se dice literalmente \xABvolver a casa\xBB. No hay nada raro en ello: lo dice todo el mundo, tambi\xE9n quien va a llev\xE1rselo a la oficina.",tuyas:[{rom:"kl\xE0p b\xE2an khr\xE1p",thai:"\u0E01\u0E25\u0E31\u0E1A\u0E1A\u0E49\u0E32\u0E19\u0E04\u0E23\u0E31\u0E1A",es:"Para llevar",uso:"Dos palabras y ya est\xE1."},{rom:"kin th\xEEi-n\xEEi khr\xE1p",thai:"\u0E01\u0E34\u0E19\u0E17\u0E35\u0E48\u0E19\u0E35\u0E48\u0E04\u0E23\u0E31\u0E1A",es:"Para comer aqu\xED"},{rom:"s\xE0y th\u01D4\u014B khr\xE1p",thai:"\u0E43\u0E2A\u0E48\u0E16\u0E38\u0E07\u0E04\u0E23\u0E31\u0E1A",es:"M\xE9temelo en bolsa"},{rom:"m\xE2i \u0294aw th\u01D4\u014B khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E40\u0E2D\u0E32\u0E16\u0E38\u0E07\u0E04\u0E23\u0E31\u0E1A",es:"Sin bolsa",uso:"Cada vez m\xE1s normal. Te van a mirar bien."},{rom:"kh\u0254\u030C\u0254 ch\u0254\u0301\u0254n s\u0254\u0302\u0254m d\xFBay khr\xE1p",thai:"\u0E02\u0E2D\u0E0A\u0E49\u0E2D\u0E19\u0E2A\u0E49\u0E2D\u0E21\u0E14\u0E49\u0E27\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"Cuchara y tenedor tambi\xE9n",uso:"d\xFBay = \xABtambi\xE9n, adem\xE1s\xBB."}],oyes:[{rom:"s\xE0y th\u01D4\u014B m\xE1y",thai:"\u0E43\u0E2A\u0E48\u0E16\u0E38\u0E07\u0E44\u0E2B\u0E21",es:"\xBFTe lo pongo en bolsa?"},{rom:"th\xEEi-n\xEEi r\u0268\u030C\u0268 kl\xE0p b\xE2an",thai:"\u0E17\u0E35\u0E48\u0E19\u0E35\u0E48\u0E2B\u0E23\u0E37\u0E2D\u0E01\u0E25\u0E31\u0E1A\u0E1A\u0E49\u0E32\u0E19",es:"\xBFAqu\xED o para llevar?"}],ojo:["En Tailandia se come con cuchara y tenedor, no con palillos. Los palillos son solo para los fideos, que son chinos.","El tenedor empuja, la cuchara se lleva a la boca. Comer directamente del tenedor se ve raro."],calle:"Pide algo para llevar diciendo kl\xE0p b\xE2an khr\xE1p."},{id:"m-pagar",bloque:"puesto",title:"Cu\xE1nto es y pagar",donde:"Todas partes",meta:"Entender el precio de o\xEDdo y pagar sin mirar la calculadora.",intro:"Casi todo en un puesto cuesta entre 40 y 80 baht, as\xED que la mitad del trabajo es reconocer esos n\xFAmeros al vuelo. La otra mitad es que hoy en Tailandia se paga m\xE1s por QR que en efectivo.",tuyas:[{rom:"th\xE2w r\xE0y khr\xE1p",thai:"\u0E40\u0E17\u0E48\u0E32\u0E44\u0E2B\u0E23\u0E48\u0E04\u0E23\u0E31\u0E1A",es:"\xBFCu\xE1nto es?",uso:"Universal."},{rom:"k\xECi b\xE0at khr\xE1p",thai:"\u0E01\u0E35\u0E48\u0E1A\u0E32\u0E17\u0E04\u0E23\u0E31\u0E1A",es:"\xBFCu\xE1ntos baht?",uso:"M\xE1s concreta y m\xE1s f\xE1cil de entender la respuesta."},{rom:"s\xE0-k\xE6n d\xE2ay m\xE1y khr\xE1p",thai:"\u0E2A\u0E41\u0E01\u0E19\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"\xBFPuedo pagar con QR?",uso:"Hoy casi siempre s\xED, hasta en un carrito."},{rom:"\u014B\u0259n s\xF2t khr\xE1p",thai:"\u0E40\u0E07\u0E34\u0E19\u0E2A\u0E14\u0E04\u0E23\u0E31\u0E1A",es:"En efectivo"},{rom:"kh\xEDt \u014B\u0259n d\xFBay khr\xE1p",thai:"\u0E04\u0E34\u0E14\u0E40\u0E07\u0E34\u0E19\u0E14\u0E49\u0E27\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"La cuenta, por favor",uso:"En restaurante con mesas. En un puesto se paga y ya."}],oyes:[{rom:"h\xF2k-s\xECp b\xE0at khr\xE1p",thai:"\u0E2B\u0E01\u0E2A\u0E34\u0E1A\u0E1A\u0E32\u0E17\u0E04\u0E23\u0E31\u0E1A",es:"Sesenta baht"},{rom:"mii th\u0254\u0254n m\xE1y",thai:"\u0E21\u0E35\u0E17\u0E2D\u0E19\u0E44\u0E2B\u0E21",es:"\xBFTienes suelto?",que:"th\u0254\u0254n es el cambio. Con billetes de 1000 te lo van a preguntar siempre."},{rom:"c\u025B\u0300\u025Bk s\u0254\u030C\u0254\u014B khon m\xE1y",thai:"\u0E41\u0E22\u0E01\u0E2A\u0E2D\u0E07\u0E04\u0E19\u0E44\u0E2B\u0E21",es:"\xBFCuentas separadas?"}],ojo:["Los precios se dicen enteros: h\xE2a-s\xECp (50), h\xF2k-s\xECp h\xE2a (65). Si te pierdes, k\xECi b\xE0at khr\xE1p y te lo repiten m\xE1s despacio.","Escanear un QR es s\xE0-k\xE6n, del ingl\xE9s. Muchas palabras modernas se dicen as\xED y son regalos para ti."],calle:"Pregunta el precio en tailand\xE9s y intenta entender la respuesta antes de mirar el m\xF3vil."},{id:"m-quees",bloque:"puesto",title:"Qu\xE9 es esto y qu\xE9 est\xE1 bueno",donde:"Mercados, puestos que no conoces",meta:"Comer algo que no habr\xEDas pedido nunca.",intro:"Esta es la misi\xF3n que convierte la app en gastronom\xEDa de verdad. Preguntar qu\xE9 es algo abre una conversaci\xF3n, y preguntar qu\xE9 est\xE1 bueno le da a alguien la oportunidad de estar orgulloso de su trabajo. Suele acabar en comida gratis.",tuyas:[{rom:"\u0294an-n\xEDi kh\u0268\u0268 \u0294\xE0-ray khr\xE1p",thai:"\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E04\u0E37\u0E2D\u0E2D\u0E30\u0E44\u0E23\u0E04\u0E23\u0E31\u0E1A",es:"\xBFQu\xE9 es esto?",uso:"Se\xF1alando. Perfectamente normal."},{rom:"\u0294\xE0-ray \u0294\xE0-r\u0254\u0300y khr\xE1p",thai:"\u0E2D\u0E30\u0E44\u0E23\u0E2D\u0E23\u0E48\u0E2D\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"\xBFQu\xE9 est\xE1 bueno?",uso:"La pregunta que m\xE1s puertas abre."},{rom:"\u0294an-n\u01CEy \u0294\xE0-r\u0254\u0300y th\xEEi-s\xF9t khr\xE1p",thai:"\u0E2D\u0E31\u0E19\u0E44\u0E2B\u0E19\u0E2D\u0E23\u0E48\u0E2D\u0E22\u0E17\u0E35\u0E48\u0E2A\u0E38\u0E14\u0E04\u0E23\u0E31\u0E1A",es:"\xBFCu\xE1l es el mejor?",uso:"th\xEEi-s\xF9t es el superlativo."},{rom:"kh\u0254\u030C\u0254 l\u0254\u0254\u014B d\xE2ay m\xE1y khr\xE1p",thai:"\u0E02\u0E2D\u0E25\u0E2D\u0E07\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"\xBFPuedo probar?",uso:"l\u0254\u0254\u014B es \xABprobar, intentar\xBB."},{rom:"mii \u0294\xE0-ray ph\xED-s\xE8et m\xE1y khr\xE1p",thai:"\u0E21\u0E35\u0E2D\u0E30\u0E44\u0E23\u0E1E\u0E34\u0E40\u0E28\u0E29\u0E44\u0E2B\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"\xBFHay algo especial?"}],oyes:[{rom:"\u0294an-n\xEDi \u0294\xE0-r\u0254\u0300y m\xE2ak",thai:"\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E2D\u0E23\u0E48\u0E2D\u0E22\u0E21\u0E32\u0E01",es:"Este est\xE1 buen\xEDsimo"},{rom:"kh\u0254\u030C\u0254\u014B dii",thai:"\u0E02\u0E2D\u0E07\u0E14\u0E35",es:"Es del bueno",que:"Elogio de vendedor."},{rom:"l\u0254\u0254\u014B duu s\xED",thai:"\u0E25\u0E2D\u0E07\u0E14\u0E39\u0E2A\u0E34",es:"Anda, pru\xE9balo",que:"Prueba."}],ojo:["\u0294an (\u0E2D\u0E31\u0E19) es el clasificador comod\xEDn para cosas. \u0294an-n\xEDi = \xABesta cosa\xBB, \u0294an-n\u01CEy = \xABcu\xE1l\xBB.","ph\xED-s\xE8et (\u0E1E\u0E34\u0E40\u0E28\u0E29) significa \xABespecial\xBB y en un puesto quiere decir raci\xF3n grande. Pide kh\xE2aw man k\xE0y ph\xED-s\xE8et y ver\xE1s."],calle:"Se\xF1ala algo que no conozcas y pregunta \u0294an-n\xEDi kh\u0268\u0268 \u0294\xE0-ray khr\xE1p. Luego c\xF3mpralo."},{id:"m-ajustar",bloque:"puesto",title:"Ajustar el plato a tu gusto",donde:"Puestos de arroz y fideos",meta:"Que tu plato salga como t\xFA lo quieres.",intro:"Aqu\xED es donde dejas de ser turista. El que come a diario ajusta: huevo encima, m\xE1s arroz, sin cilantro, raci\xF3n grande. Y todo se construye con dos piezas que ya tienes: kh\u0254\u030C\u0254 para a\xF1adir y m\xE2i s\xE0y para quitar.",tuyas:[{rom:"kh\u0254\u030C\u0254 kh\xE0y daaw d\xFBay khr\xE1p",thai:"\u0E02\u0E2D\u0E44\u0E02\u0E48\u0E14\u0E32\u0E27\u0E14\u0E49\u0E27\u0E22\u0E04\u0E23\u0E31\u0E1A",es:"Con un huevo frito encima",uso:"El gesto m\xE1s tailand\xE9s que existe. Cuesta 10 baht."},{rom:"kh\u0254\u030C\u0254 kh\xE2aw ph\u0259\u0302\u0259m khr\xE1p",thai:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E40\u0E1E\u0E34\u0E48\u0E21\u0E04\u0E23\u0E31\u0E1A",es:"M\xE1s arroz"},{rom:"m\xE2i s\xE0y ph\xE0k-chii khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1C\u0E31\u0E01\u0E0A\u0E35\u0E04\u0E23\u0E31\u0E1A",es:"Sin cilantro",uso:"Si eres de los que no lo soportan, memoriza esta."},{rom:"m\xE2i s\xE0y th\xF9a khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E16\u0E31\u0E48\u0E27\u0E04\u0E23\u0E31\u0E1A",es:"Sin cacahuete",uso:"Importante si hay alergia."},{rom:"kh\u0254\u030C\u0254 ph\xED-s\xE8et khr\xE1p",thai:"\u0E02\u0E2D\u0E1E\u0E34\u0E40\u0E28\u0E29\u0E04\u0E23\u0E31\u0E1A",es:"Raci\xF3n grande"},{rom:"m\xE2i s\xE0y n\xE1m-plaa khr\xE1p",thai:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E1B\u0E25\u0E32\u0E04\u0E23\u0E31\u0E1A",es:"Sin salsa de pescado",uso:"Clave si eres vegetariano: est\xE1 en casi todo."}],oyes:[{rom:"kh\xE0y daaw r\u0268\u030C\u0268 kh\xE0y ciaw",thai:"\u0E44\u0E02\u0E48\u0E14\u0E32\u0E27\u0E2B\u0E23\u0E37\u0E2D\u0E44\u0E02\ /* sin fuentes externas */

.app {
  --sky-1: #122A52; --sky-2: #2C5C8C; --sky-3: #E7A54A; --sky-4: #F6D98A;
  --gold: #E0B34C; --saffron: #EE7B34; --celadon: #57A995;
  --ivory: #FFFFFF; --muted: #5C6B85; --on-grad: rgba(255,255,255,.82);
  --ink: #16233A; --paper: #FFFFFF; --paper-2: #F4F7FC;
  --lacquer: #122A52; --lacquer-2: #1F3A66;
  --shadow: 0 10px 26px rgba(15,35,70,.14); --shadow-sm: 0 6px 16px rgba(15,35,70,.10);
  display: flex; flex-direction: column; min-height: 100vh;
  background: transparent;
  color: var(--ivory); font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased;
}
body { background: linear-gradient(165deg, var(--sky-1) 0%, var(--sky-2) 42%, var(--sky-3) 78%, var(--sky-4) 100%); }
body::before { content: ""; position: fixed; inset: 0; z-index: -2;
  background: linear-gradient(165deg, #122A52 0%, #2C5C8C 42%, #E7A54A 78%, #F6D98A 100%); }
.app *, .app *::before, .app *::after { box-sizing: border-box; }
.app :where(button) { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
.app button:focus-visible, .app input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

.main { flex: 1; padding-bottom: 92px; }
.screen { max-width: 640px; margin: 0 auto; padding: 26px 20px 40px; }
.loading { color: var(--on-grad); padding-top: 60px; text-align: center; }

.title { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 30px; margin: 4px 0; letter-spacing: -0.01em; }
.sub { color: var(--on-grad); font-size: 14.5px; line-height: 1.55; margin: 0 0 20px; }
.label { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--on-grad); margin: 0; }
.prose { font-size: 14.5px; line-height: 1.65; color: #3A4A63; margin: 0; }
.prose strong { color: var(--gold); font-weight: 500; }
.block-title { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 600; margin: 26px 0 4px; }
.block-sub { font-size: 13px; color: var(--on-grad); margin: 0 0 14px; line-height: 1.5; }
.foot { font-size: 12px; color: var(--on-grad); text-align: center; margin: 16px 0 0; line-height: 1.5; }
.foot.top { margin: 12px 0 4px; }
.center { text-align: center; margin-left: auto; margin-right: auto; }
.warn { border: 1px solid rgba(238,123,52,0.4); background: #FFF4EC; color: var(--ink); border-radius: 16px; padding: 16px; margin-bottom: 22px; box-shadow: var(--shadow-sm); }

.kanok { display: block; width: 108px; margin: 16px auto 0; fill: var(--gold); opacity: 0.75; }
.kanok-sm { width: 62px; margin: 0 auto 14px; opacity: 0.5; }

.spk { display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(224,179,76,0.45);
  background: rgba(224,179,76,0.1); vertical-align: middle; }
.spk svg { width: 17px; height: 17px; fill: var(--gold); stroke: var(--gold); }
.spk.big { width: 44px; height: 44px; margin-top: 14px; }
.spk.big svg { width: 21px; height: 21px; }
.spk:active { background: rgba(224,179,76,0.25); }

.hero { text-align: center; padding: 20px 0 6px; }
.hero-th { font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; font-weight: 600; font-size: 62px; line-height: 1.25;
  margin: 10px 0 0; color: var(--gold); text-shadow: 0 0 44px rgba(224,179,76,0.28); }
.hero-rom { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 17px; color: var(--on-grad); margin: 2px 0 0; }
.review-cta { display: block; width: 100%; text-align: left; margin: 26px 0 12px; padding: 22px; border-radius: 22px;
  background: linear-gradient(150deg, #FFE7D3, #FFFFFF); border: none; box-shadow: var(--shadow); color: var(--ink); }
.review-cta .label { color: var(--saffron); }
.review-num { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 46px; line-height: 1; display: block; }
.review-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 6px; }
.stage-cta { display: block; width: 100%; text-align: left; padding: 20px; border-radius: 18px;
  background: var(--paper); border: 1px solid rgba(224,179,76,0.35); box-shadow: var(--shadow-sm); color: var(--ink); }
.stage-title { display: block; font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; line-height: 1.2; }
.stage-why { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 14px; line-height: 1.5; }
.stage-count { display: block; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.panel { background: var(--paper); border: none; box-shadow: var(--shadow); border-radius: 20px; padding: 20px; margin: 22px 0; color: var(--ink); }
.daily-th { font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; font-size: 32px; margin: 0; line-height: 1.35; }
.daily-rom { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-style: normal; color: var(--celadon); font-size: 16px; margin: 4px 0 0; }
.daily-rom.lead { font-size: 26px; color: var(--gold); font-style: normal; }
.daily-thai { font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; font-size: 20px; color: var(--ink); margin: 6px 0 0; opacity: .85; }
.daily-es { font-size: 15px; margin: 8px 0 12px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--paper-2); border: none; border-radius: 16px; padding: 16px; color: var(--ink); }
.stat-num { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 32px; color: var(--gold); }
.stat-den { font-size: 15px; color: var(--muted); }
.stat-lab { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

.btn { padding: 15px 22px; border-radius: 999px; font-size: 15px; font-weight: 700; transition: transform .12s ease; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: linear-gradient(150deg, var(--saffron), #D9691F); color: #2A1206; font-weight: 700; box-shadow: 0 10px 22px rgba(238,123,52,.32); }
.btn-ghost { border: 1.5px solid rgba(22,35,58,0.18); color: var(--ink); }
.btn.wide { width: 100%; }
.back { color: var(--on-grad); font-size: 13.5px; padding: 6px 0; margin-bottom: 6px; font-weight: 600; }

.route { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.stage { background: var(--paper); box-shadow: var(--shadow-sm); border: 2px solid transparent; border-radius: 18px; overflow: hidden; color: var(--ink); }
.stage.current { border-color: rgba(238,123,52,0.5); }
.stage.done { opacity: .7; }
.stage-head { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 15px 17px; }
.stage-num { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px;
  border: 1px solid rgba(224,179,76,0.5); color: var(--gold); }
.stage.done .stage-num { background: var(--celadon); border-color: var(--celadon); color: #06231C; }
.stage.current .stage-num { background: var(--saffron); border-color: var(--saffron); color: #2A1206; }
.stage-info { flex: 1; min-width: 0; }

.sound { display: flex; gap: 16px; align-items: flex-start; background: var(--paper); color: var(--ink);

.art svg { display: block; width: 100%; height: auto; }
.art-cap { font-size: 11.5px; color: var(--muted); text-align: center; margin: 4px 0 2px; line-height: 1.4; }
.a-lab { font-size: 9.5px; fill: #5C6B85; font-family: system-ui, -apple-system, sans-serif; letter-spacing: .04em; }
.a-yr { font-size: 12px; fill: #E0B34C; font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
.a-day { font-size: 12px; fill: #16233A; font-family: system-ui, -apple-system, sans-serif; font-weight: 700; }
.a-thai { font-size: 34px; fill: #E0B34C; font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; }
.a-thai.sm { font-size: 26px; opacity: .6; }

.cap-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.cap { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; padding: 14px;
  background: var(--paper); box-shadow: var(--shadow-sm); border-radius: 20px; color: var(--ink); }
.cap-art { flex: none; width: 96px; height: 62px; overflow: hidden; border-radius: 12px;
  background: var(--paper-2); display: flex; align-items: center; }
.cap-art svg { width: 100%; height: auto; }
.cap-txt { flex: 1; min-width: 0; }
.cap-name { display: block; font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 19px; line-height: 1.2; }
.cap-blurb { display: block; font-size: 12.5px; color: var(--muted); margin: 4px 0 6px; line-height: 1.45; }
.cap-count { display: block; font-size: 11px; color: var(--celadon); }
.wide-tool { width: 100%; margin-bottom: 12px; }

.secs { display: flex; flex-direction: column; gap: 16px; }
.sec { background: var(--paper); box-shadow: var(--shadow-sm); color: var(--ink);
  border-left: 3px solid var(--gold); border-radius: 16px; padding: 20px; }
.sec.read { border-left-color: var(--celadon); opacity: 0.78; }
.sec h3 { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 600; margin: 0 0 10px; line-height: 1.28; }
.sec p { font-size: 15px; line-height: 1.7; color: #3A4A63; margin: 0 0 12px; }
.sec p:last-of-type { margin-bottom: 0; }
.sec-dato { border-top: 1px solid rgba(224,179,76,0.25); padding-top: 12px; margin-top: 14px !important;
  font-size: 14px !important; color: #8A6A1F !important; }
.sec-dato span { display: block; font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 5px; }
.sec .mark { margin-top: 16px; }


/* --- v7: fotos, frases y m\xE1s comida --- */
.foto { margin: 4px 0 14px; border-radius: 14px; overflow: hidden;
  border: none; box-shadow: var(--shadow-sm); background: var(--paper-2); }
.foto img { display: block; width: 100%; height: auto; }
.foto figcaption { font-size: 11px; color: var(--muted); padding: 7px 12px; }
.frases { border-top: 1px solid rgba(87,169,149,0.3); margin-top: 14px; padding-top: 12px;
  display: flex; flex-direction: column; gap: 9px; }
.frases-lab { display: block; font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--celadon); margin: 0 0 2px; }
.frase { display: flex; align-items: center; gap: 10px; }
.frase-main { flex: 1; min-width: 0; }
.frase-rom { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.frase-th { display: block; font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; font-size: 14.5px; color: var(--gold); margin-top: 2px; }
.frase-es { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.frase.pedir { background: rgba(87,169,149,0.08); border: 1px solid rgba(87,169,149,0.3);
  border-radius: 12px; padding: 12px 14px; margin: 12px 0 2px; }
.btn.mt { margin-top: 10px; }
.result .btn { display: block; margin-left: auto; margin-right: auto; max-width: 320px; }


/* ---- a\xF1adidos de la versi\xF3n de misiones ---- */
.big-prompt { font-size: 21px; line-height: 1.35; margin: 6px 0 4px; color: var(--ink); font-weight: 600; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--on-grad); margin: 0 0 10px; }
.frase-side { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.frase.oye { border-left: 2px solid var(--celadon); padding-left: 12px; }
.panel { border: none; box-shadow: var(--shadow); border-radius: 20px; padding: 18px; margin: 22px 0; background: var(--paper); color: var(--ink); }
.panel .block-title { margin-top: 0; }
.calle-panel { border-color: rgba(238,123,52,0.45); background: #FFF1E7; }
.calle-panel .prose { margin: 8px 0 16px; color: var(--ink); font-size: 15.5px; }
.deck.done .deck-name { color: var(--celadon); }
.grades { display: flex; gap: 10px; margin-top: 18px; }
.grade { flex: 1; padding: 15px 6px; border-radius: 20px; font-size: 13.5px; font-weight: 700;
  border: none; box-shadow: var(--shadow-sm); background: var(--paper); color: var(--ink); }
.grade.again { border-color: rgba(238,123,52,0.5); color: #C24A3D; background: #FDF1EC; }
.grade.hard { border-color: rgba(224,179,76,0.5); color: var(--gold); }
.grade.good { border-color: rgba(87,169,149,0.55); color: var(--celadon); }
.stat-num { display: block; font-size: 30px; color: var(--gold); }
.stat-lab { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 26px; }
.wide-tool { grid-column: 1 / -1; }
.mt { margin-top: 12px; }
.btn:disabled { opacity: .5; }
.foot.center { text-align: center; }
.counter { display: flex; justify-content: space-between; align-items: center; color: var(--on-grad); font-size: 12.5px; margin-bottom: 14px; }
.back.sm { font-size: 12.5px; }
.cap-list li { margin-bottom: 12px; }

/* --- v12: hora, diccionario al toque, mazos, ajustes --- */
.clock { gap: 8px; }
.clk { display: flex; align-items: center; gap: 12px; background: var(--paper); color: var(--ink);
  box-shadow: var(--shadow-sm); border-left: 4px solid var(--gold); border-radius: 14px; padding: 10px 12px; }
.clk.current { outline: 2px solid var(--saffron); outline-offset: -2px; background: #FFF6EC; }
.clk-h { flex: none; width: 50px; font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 600; color: var(--muted); }
.clk.current .clk-h { color: var(--saffron); }
.clk-body { flex: 1; min-width: 0; text-align: left; padding: 0; }
.clk-rom { display: block; font-size: 16px; font-weight: 600; line-height: 1.4; }
.clk-th { display: block; font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; font-size: 15px; color: var(--gold); margin-top: 2px; }
.clk-note { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
.panel.ahora { text-align: center; margin: 14px 0 6px; background: linear-gradient(150deg, #FFF3DC, #FFFFFF); }
.ahora-rom { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 700; margin: 4px 0 0; line-height: 1.35; }
.ahora-th { font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; font-size: 26px; color: var(--gold); margin: 6px 0 0; }
.ahora-note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
.panel.clock-quiz { text-align: center; padding: 22px 20px 24px; }
.panel.clock-quiz .big-hour { font-size: 64px; margin: 10px 0 18px; }
.eyebrow.dark { color: var(--muted); }
.quiz-answer { font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.4; }
.panel.clock-quiz .foot { color: var(--muted); margin-bottom: 14px; }
.rom-word { padding: 2px 2px; border-bottom: 1.5px dotted rgba(224,179,76,.75); white-space: nowrap; }
.rom-tip { display: block; font-size: 13.5px; line-height: 1.4; padding: 7px 11px; margin: 6px 0 2px; box-shadow: var(--shadow-sm); white-space: normal; border-radius: 10px; font-weight: 500; }
.rom-tip b { font-weight: 700; }
.rom-tip-comp { display: block; font-size: 12px; opacity: .85; margin-top: 2px; }
.lista-deck .frase-side { flex-direction: row; flex-wrap: wrap; justify-content: center; width: 96px; gap: 6px 4px; }
.rom-tip-th { font-family: 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', 'Sarabun', 'Noto Serif Thai', sans-serif; opacity: .8; }
.frase-rom .rom-tap, .card-rom .rom-tap, .pat-ex-rom .rom-tap { display: inline; }
.deck-prog { margin: 4px 0 6px; }
.deck-prog-lab { display: block; font-size: 12px; color: var(--on-grad); margin-top: 6px; }
.lista-deck .frase.vista { border-left: 3px solid var(--gold); }
.lista-deck .frase.ok { border-left: 3px solid var(--celadon); }
.chip.sm { padding: 6px 10px; font-size: 11.5px; }
.chip.alt { background: #FFF3DC; color: #6B4A12; }
.frase-side { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.sound { align-items: flex-start; }
.sound-main { flex: 1; min-width: 0; }
.sound-name { display: block; font-size: 15px; font-weight: 600; margin: 0; }
.sound-desc { display: block; font-size: 13.5px; color: #3A4A63; line-height: 1.6; margin: 4px 0 0; }
.stats.dark { margin-top: 6px; }
.prose.small { font-size: 13px; color: var(--muted); margin-top: 12px; }
.prose.ok { color: #2F5C4E; }
.pasos { margin: 14px 0 0; padding-left: 22px; font-size: 14px; line-height: 1.6; color: #3A4A63; }
.pasos li { margin-bottom: 8px; }
.panel .btn-primary { margin-top: 8px; }
.link-ajustes { display: block; width: 100%; text-align: center; margin: 18px 0 0; padding: 12px; font-size: 13px; color: var(--on-grad); }
.update-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--saffron); color: #2A1D06; font-weight: 600; font-size: 13.5px; text-align: center; box-shadow: var(--shadow); }
.counter .back.sm { margin: 0; padding: 4px 6px; }
.panel.lista-panel { padding: 6px 16px 14px; margin: 10px 0 18px; }
.panel.lista-panel .frases { border-top: none; margin-top: 0; padding-top: 0; gap: 0; }
.panel.lista-panel .frase { padding: 12px 0; border-bottom: 1px solid rgba(22,35,58,0.08); }
.panel.lista-panel .frase:last-child { border-bottom: none; }
.panel.lista-panel .frase.oye { border-left: none; padding-left: 0; }
.panel.lista-panel .frase.vista { padding-left: 10px; }
.panel.lista-panel .frase.ok { padding-left: 10px; }
.panel.lista-panel .card-note { max-width: none; }
